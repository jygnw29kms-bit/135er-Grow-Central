<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>135er-Grow Central Setup</title>
  <style>
    body{margin:0;background:#02070a;color:#edfdf9;font-family:Arial,sans-serif}.box{max-width:760px;margin:20px auto;padding:24px;background:#061319;border:1px solid #17414a}h1,h2{color:#2ae5ff}label{display:grid;gap:6px;margin:12px 0}input,select{padding:12px;background:#020a0e;color:white;border:1px solid #17414a}button{padding:14px;background:#71ff3b;border:0;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.msg{color:#ff8b96}.hint{padding:10px;border:1px solid #17414a;background:#020a0e}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <form class="box" id="setup">
    <h1>135er-Grow Central</h1>
    <p>Erstinbetriebnahme – diese Seite wird erst nach erfolgreicher Netzwerk- und Systemprüfung entfernt.</p>
    <h2>Temporärer Zugang</h2>
    <div class="grid"><label>Benutzer<input name="setup_username" value="GrowCentral" required></label><label>Passwort<input name="setup_password" type="password" value="grow-central-test" required></label></div>
    <h2>Netzwerk</h2>
    <p class="hint" id="lanState">LAN-Verbindung wird geprüft …</p>
    <label>Verbindung<select name="mode" id="mode"><option value="ethernet">LAN dauerhaft verwenden</option><option value="wifi">Mit WLAN verbinden</option></select></label>
    <div id="wifiFields" class="hidden">
      <label>Gefundene WLAN-Netze<select id="wifiList"><option value="">WLAN-Suche läuft …</option></select></label>
      <button type="button" id="rescan">WLAN erneut suchen</button>
      <div class="grid"><label>WLAN-Name (SSID)<input name="ssid" id="ssid"></label><label>WLAN-Passwort<input name="wifi_password" type="password"></label></div>
    </div>
    <h2>Zugangsdaten</h2>
    <div class="grid"><label>Neues System-/SSH-Passwort<input name="new_password" type="password" minlength="12" required></label><label>GUI-Benutzer<input name="gui_username" value="GrowCentral" required></label></div>
    <label>GUI-Passwort<input name="gui_password" type="password" minlength="12" required></label>
    <h2>System</h2>
    <div class="grid"><label>Hostname<input name="hostname" value="135er-grow-central" required></label><label>Zeitzone<select name="timezone"><option>Europe/Berlin</option><option>UTC</option><option>Europe/Vienna</option><option>Europe/Zurich</option></select></label></div>
    <p class="msg" id="msg"></p><button id="submitButton">Konfiguration prüfen und übernehmen</button>
  </form>
  <script>
    const form=document.getElementById('setup'),mode=document.getElementById('mode'),wifiFields=document.getElementById('wifiFields'),wifiList=document.getElementById('wifiList'),ssid=document.getElementById('ssid'),msg=document.getElementById('msg'),submitButton=document.getElementById('submitButton');
    function showMode(){wifiFields.classList.toggle('hidden',mode.value!=='wifi');ssid.required=mode.value==='wifi'}
    async function networkStatus(){try{const r=await fetch('/api/setup/network-status');const x=await r.json();const lan=x.ethernet||{};document.getElementById('lanState').textContent=lan.internet?`LAN mit Internet erkannt (${(lan.addresses||[]).join(', ')}). Bitte LAN beibehalten oder WLAN wählen.`:lan.connected?'LAN verbunden, Internet konnte noch nicht bestätigt werden.':`Kein funktionsfähiges LAN erkannt (${x.connectivity||'unbekannt'}).`;if(!lan.connected)mode.value='wifi';showMode();if(mode.value==='wifi')scan()}catch{document.getElementById('lanState').textContent='LAN-Status konnte nicht gelesen werden.'}}
    async function scan(){wifiList.innerHTML='<option value="">WLAN-Suche läuft …</option>';try{const r=await fetch('/api/setup/networks');const x=await r.json();if(!r.ok)throw new Error(x.detail||'WLAN-Suche fehlgeschlagen');wifiList.innerHTML='<option value="">WLAN auswählen oder manuell eintragen</option>';for(const n of x.networks||[]){const o=document.createElement('option');o.value=n.ssid;o.textContent=`${n.ssid} – ${n.signal}% – ${n.security||'offen'}`;wifiList.appendChild(o)}}catch(e){wifiList.innerHTML='<option value="">WLAN-Suche fehlgeschlagen</option>';msg.textContent=e.message}}
    async function pollResult(){for(let i=0;i<90;i++){await new Promise(r=>setTimeout(r,2000));try{const r=await fetch('/api/setup/status');if(r.status===404){location.reload();return}const x=await r.json();if(x.error)throw new Error(x.error);if(!x.pending&&!x.setup_required){location.reload();return}}catch(e){if(mode.value==='wifi'){msg.style.color='#71ff3b';msg.textContent='WLAN wird umgestellt. Verbinde dein iPhone anschließend mit dem Heimnetz und öffne http://135er-grow-central.local:8080.';return}throw e}}throw new Error('Die Gegenprüfung dauert zu lange. setup.html bleibt erhalten.')}
    mode.addEventListener('change',()=>{showMode();if(mode.value==='wifi')scan()});wifiList.addEventListener('change',()=>{if(wifiList.value)ssid.value=wifiList.value});document.getElementById('rescan').addEventListener('click',scan);
    form.addEventListener('submit',async e=>{e.preventDefault();msg.style.color='#ff8b96';msg.textContent='Konfiguration, Netzwerk, Internet und Hauptsystem werden geprüft …';submitButton.disabled=true;const data=Object.fromEntries(new FormData(form));data.fritz_enabled=false;try{const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const x=await r.json();if(!r.ok)throw new Error(x.detail||'Setup fehlgeschlagen');msg.style.color='#71ff3b';msg.textContent='Daten übernommen. Abschlussprüfung läuft …';await pollResult()}catch(err){msg.style.color='#ff8b96';msg.textContent=err.message;submitButton.disabled=false}});
    showMode();networkStatus();
  </script>
</body>
</html>
