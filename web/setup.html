<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>135er-Grow Central Setup</title><style>body{margin:0;background:#02070a;color:#edfdf9;font-family:Arial,sans-serif}.box{max-width:760px;margin:20px auto;padding:24px;background:#061319;border:1px solid #17414a}h1,h2{color:#2ae5ff}label{display:grid;gap:6px;margin:12px 0}input,select{padding:12px;background:#020a0e;color:white;border:1px solid #17414a}button{padding:14px;background:#71ff3b;border:0;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.msg{color:#ff8b96}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><form class="box" id="setup"><h1>135er-Grow Central</h1><p>Erstinbetriebnahme – diese Seite verschwindet erst nach erfolgreicher Gegenprüfung.</p><h2>Temporärer Zugang</h2><div class="grid"><label>Benutzer<input name="setup_username" value="GrowCentral" required></label><label>Passwort<input name="setup_password" type="password" value="grow-central-test" required></label></div><h2>Netzwerk</h2><label>Verbindung<select name="mode"><option value="ethernet">LAN beibehalten</option><option value="wifi">WLAN einrichten</option></select></label><div class="grid"><label>WLAN-Name (SSID)<input name="ssid"></label><label>WLAN-Passwort<input name="wifi_password" type="password"></label></div><h2>Zugangsdaten</h2><div class="grid"><label>Neues System-/SSH-Passwort<input name="new_password" type="password" minlength="12" required></label><label>GUI-Benutzer<input name="gui_username" value="GrowCentral" required></label></div><label>GUI-Passwort<input name="gui_password" type="password" minlength="12" required></label><h2>System</h2><div class="grid"><label>Hostname<input name="hostname" value="135er-grow-central" required></label><label>Zeitzone<select name="timezone"><option>Europe/Berlin</option><option>UTC</option><option>Europe/Vienna</option><option>Europe/Zurich</option></select></label></div><p class="msg" id="msg"></p><button>Konfiguration prüfen und übernehmen</button></form><script>setup.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Konfiguration wird geprüft …';const data=Object.fromEntries(new FormData(setup));data.fritz_enabled=false;try{const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const x=await r.json();if(!r.ok)throw new Error(x.detail||'Setup fehlgeschlagen');msg.style.color='#71ff3b';msg.textContent='Übernommen. Netzwerk und Hauptsystem werden gegengeprüft. Diese Seite bleibt bei einem Fehler erhalten.'}catch(err){msg.textContent=err.message}})</script></body></html>
