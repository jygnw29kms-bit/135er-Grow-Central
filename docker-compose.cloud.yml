# DE: GrowCentral Cloud-Stack.
# EN: GrowCentral cloud stack.
services:
  grow-central-cloud:
    build:
      context: .
      dockerfile: cloud/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./cloud/.env
    volumes:
      # Bestehende Geräte-/Telemetriedaten bleiben in der Cloud-SQLite-Datenbank.
      - grow-central-cloud-data:/app/cloud/data
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:8090:8090"

  grow-central-backoffice-db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ./backoffice/.env
    volumes:
      - grow-central-backoffice-db-data:/var/lib/postgresql/data
      - ./database/backoffice_schema.sql:/docker-entrypoint-initdb.d/10-backoffice.sql:ro
      - ./database/migrations/20261017_backoffice_ledger.sql:/docker-entrypoint-initdb.d/20-backoffice-ledger.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - backoffice-internal

  grow-central-backoffice-api:
    build:
      context: .
      dockerfile: backoffice/GrowCentral.Backoffice.Api/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./backoffice/.env
    depends_on:
      grow-central-backoffice-db:
        condition: service_healthy
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    ports:
      # Nur localhost. Veröffentlichung ausschließlich über den abgesicherten Reverse Proxy.
      - "127.0.0.1:8091:8091"
    networks:
      - backoffice-internal
      - default

volumes:
  grow-central-cloud-data:
  grow-central-backoffice-db-data:

networks:
  backoffice-internal:
    internal: true
