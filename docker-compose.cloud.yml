# DE: Minimaler VServer-Cloud-Stack.
# EN: Minimal VPS cloud stack.
services:
  grow-central-cloud:
    build:
      context: .
      dockerfile: cloud/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./cloud/.env
    volumes:
      # DE: SQLite persistent auf dem Host.
      # EN: Persist SQLite on the host.
      - grow-central-cloud-data:/app/cloud/data
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    ports:
      # DE: Nur localhost; öffentlich über Reverse Proxy.
      # EN: Localhost only; expose publicly through a reverse proxy.
      - "127.0.0.1:8090:8090"

volumes:
  grow-central-cloud-data:
