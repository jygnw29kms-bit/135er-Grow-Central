services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: workshop_erp_staging
      POSTGRES_USER: workshop_erp
    volumes:
      - erp_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U workshop_erp -d workshop_erp_staging"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [erpnet]

  api:
    build:
      context: ./src
      dockerfile: WorkshopManager.Erp.Api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      DemoSeed: "true"
    ports:
      - "127.0.0.1:5090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [erpnet]

volumes:
  erp_pg:

networks:
  erpnet:
