name: Fix 135erHeli WWW TLS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Reissue certificate for apex and www
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.SFTP_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || secrets.SFTP_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          : "${SSH_PORT:=22}"
          export SSHPASS="$SSH_PASSWORD"
          SCRIPT='set -euo pipefail
          FQDN="135erheli.de"
          plesk bin site -u "$FQDN" -seo-redirect non-www
          plesk sbin httpdmng --reconfigure-domain "$FQDN"
          plesk ext sslit --certificate -issue -domain "$FQDN" -secure-domain -secure-www
          plesk sbin httpdmng --reconfigure-domain "$FQDN"
          nginx -t
          systemctl reload nginx
          sleep 2
          echo | openssl s_client -connect "$FQDN:443" -servername "$FQDN" 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
          echo | openssl s_client -connect "www.$FQDN:443" -servername "www.$FQDN" 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
          curl --http1.1 -LfsS "https://$FQDN/" | grep -q "JL1976"
          curl --http1.1 -LfsS "https://www.$FQDN/" | grep -q "JL1976"'
          B64="$(printf '%s' "$SCRIPT" | base64 -w0)"
          if sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USERNAME@$SSH_HOST" 'id -u' | grep -qx 0; then
            sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USERNAME@$SSH_HOST" "echo '$B64' | base64 -d | bash"
          else
            printf '%s\n' "$SSH_PASSWORD" | sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USERNAME@$SSH_HOST" "sudo -S -p '' bash -c \"echo '$B64' | base64 -d | bash\""
          fi
