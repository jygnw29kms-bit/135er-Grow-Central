name: Deploy Website to dezender.de via SFTP

on:
  push:
    branches: [ master ]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website-sftp.yml'
      - 'scripts/install-135ercloud-v6.sh'
      - 'scripts/setup-135ercloud-apt-repo-v1.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: SFTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deploy website files
        uses: wlixcc/SFTP-Deploy-Action@da88a4dbe95286266bbac3c0b2b8284048d20c8f # v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './website/*'
          remote_path: '/var/www/vhosts/dezender.de/httpdocs/'
          delete_remote_files: false

      - name: Prepare downloadable server scripts
        run: |
          mkdir -p deploy-135ercloud
          cp scripts/install-135ercloud-v6.sh deploy-135ercloud/install-135ercloud-v6.sh
          cp scripts/setup-135ercloud-apt-repo-v1.sh deploy-135ercloud/setup-135ercloud-apt-repo.sh

      - name: Deploy downloadable server scripts
        uses: wlixcc/SFTP-Deploy-Action@da88a4dbe95286266bbac3c0b2b8284048d20c8f # v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './deploy-135ercloud/*'
          remote_path: '/var/www/vhosts/dezender.de/httpdocs/135ercloud/'
          delete_remote_files: false

      - name: Deployment information
        run: |
          echo "135er-Grow Central website deployed to dezender.de"
          echo "Target: /var/www/vhosts/dezender.de/httpdocs/"
