name: Deploy Grow Central Website to grow-central.de via SFTP

on:
  push:
    branches: [ master ]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website-sftp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: SFTP Deploy Grow Central
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare public website allowlist
        run: |
          set -euo pipefail
          install -d \
            public-site/assets/brand \
            public-site/assets/gui \
            public-site/downloads/3d

          cp website/index.html public-site/index.html
          cp website/styles.css public-site/styles.css
          cp website/impressum.html public-site/impressum.html
          cp website/datenschutz.html public-site/datenschutz.html
          cp website/assets/brand/135er-grow-central-lockup-v0.9.png public-site/assets/brand/
          cp website/assets/brand/135er-grow-central-mark.png public-site/assets/brand/
          cp website/assets/gui/local-desktop-v0.9.png public-site/assets/gui/
          cp website/downloads/3d/135er_Grow_Central_RPi4_bottom.stl public-site/downloads/3d/
          cp website/downloads/3d/135er_Grow_Central_RPi4_lid.stl public-site/downloads/3d/
          cp website/downloads/3d/135er_Grow_Central_RPi4_printplate.stl public-site/downloads/3d/
          cp website/downloads/3d/135er_Grow_Central_RPi4_case.scad public-site/downloads/3d/

      - name: Deploy Grow Central via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y lftp

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/growcentral_deploy
          chmod 600 ~/.ssh/growcentral_deploy

       - name: Deploy Grow Central via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y lftp

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/growcentral_deploy
          chmod 600 ~/.ssh/growcentral_deploy

          lftp <<EOF
          set sftp:connect-program "ssh -a -x -i ~/.ssh/growcentral_deploy -p $SFTP_PORT -o StrictHostKeyChecking=accept-new"
          set net:max-retries 2
          set net:timeout 20
          open sftp://$SFTP_USERNAME@$SFTP_HOST
          mirror --reverse --verbose --delete ./public-site /var/www/vhosts/grow-central.de/httpdocs
          bye
          EOF

          rm -f ~/.ssh/growcentral_deploy
