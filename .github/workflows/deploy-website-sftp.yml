name: Deploy Website to dezender.de via SFTP

on:
  push:
    branches: [ master ]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website-sftp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: SFTP Deploy /GC and Gods Eye Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 135er repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js for Gods Eye
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      - name: Build Gods Eye browser application
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/bilawalsidhu/gods-eye-view.git upstream-gods-eye
          cd upstream-gods-eye
          npm ci
          npm run build -- --base=/GC/godseye/
          cd ..

      - name: Prepare public website allowlist
        run: |
          set -euo pipefail
          install -d \
            public-site/assets/brand \
            public-site/assets/gui \
            public-site/godseye \
            root-site

          cp website/index.html public-site/index.html
          cp website/styles.css public-site/styles.css
          cp website/impressum.html public-site/impressum.html
          cp website/datenschutz.html public-site/datenschutz.html
          cp website/assets/brand/135er-grow-central-lockup-v0.9.png public-site/assets/brand/
          cp website/assets/brand/135er-grow-central-mark.png public-site/assets/brand/
          cp website/assets/gui/local-desktop-v0.9.png public-site/assets/gui/

          rm -rf public-site/godseye/*
          cp -R upstream-gods-eye/dist/. public-site/godseye/
          cp upstream-gods-eye/LICENSE public-site/godseye/UPSTREAM-LICENSE.txt

          python3 - <<'PY'
          from pathlib import Path
          p = Path('public-site/godseye/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>God\'s Eye View</title>', '<title>135er God\'s Eye</title>')
          s = s.replace('<title>God’s Eye View</title>', '<title>135er God’s Eye</title>')
          p.write_text(s, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('public-site/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '''        <a href="#faq">FAQ</a>\n      </div>\n      <div>\n        <strong>ENTWICKLUNG</strong>'''
          replacement = '''        <a href="#faq">FAQ</a>\n        <a href="impressum.html">Impressum</a>\n        <a href="datenschutz.html">Datenschutz</a>\n      </div>\n      <div>\n        <strong>ENTWICKLUNG</strong>'''
          if marker not in s:
              raise SystemExit('Footer marker not found in website/index.html')
          p.write_text(s.replace(marker, replacement, 1), encoding='utf-8')
          PY

          cp website/impressum.html root-site/impressum.html
          cp website/datenschutz.html root-site/datenschutz.html

          python3 - <<'PY'
          from pathlib import Path
          for name in ('impressum.html', 'datenschutz.html'):
              p = Path('root-site') / name
              s = p.read_text(encoding='utf-8')
              s = s.replace('href="assets/brand/135er-grow-central-mark.png"', 'href="/GC/assets/brand/135er-grow-central-mark.png"')
              s = s.replace('href="styles.css?v=4.0.0"', 'href="/GC/styles.css?v=4.0.0"')
              s = s.replace('href="./">Zurück zu Grow Central</a>', 'href="/GC/">Zurück zu Grow Central</a>')
              p.write_text(s, encoding='utf-8')
          PY

          cat > root-site/index.html <<'EOF'
          <!doctype html>
          <html lang="de">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex,follow">
            <meta http-equiv="refresh" content="0; url=/GC/">
            <link rel="canonical" href="https://dezender.de/GC/">
            <title>135er-Grow Central</title>
            <script>location.replace('/GC/');</script>
          </head>
          <body>
            <p>Weiterleitung zu <a href="/GC/">135er-Grow Central</a> …</p>
            <p><a href="/impressum.html">Impressum</a> · <a href="/datenschutz.html">Datenschutz</a></p>
          </body>
          </html>
          EOF

      - name: Deploy public website and Gods Eye web app to /GC
        uses: wlixcc/SFTP-Deploy-Action@da88a4dbe95286266bbac3c0b2b8284048d20c8f # v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './public-site/*'
          remote_path: '/var/www/vhosts/dezender.de/httpdocs/GC/'
          delete_remote_files: true

      - name: Replace obsolete root page and publish legal pages
        uses: wlixcc/SFTP-Deploy-Action@da88a4dbe95286266bbac3c0b2b8284048d20c8f # v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './root-site/*'
          remote_path: '/var/www/vhosts/dezender.de/httpdocs/'
          delete_remote_files: false

      - name: Deployment information
        run: |
          echo '135er-Grow Central website deployed to https://dezender.de/GC/'
          echo 'Runnable Gods Eye browser app deployed to https://dezender.de/GC/godseye/'
          echo 'Note: server-side /api proxies from the upstream Vite runtime require a separate Node service for full live-layer parity.'
