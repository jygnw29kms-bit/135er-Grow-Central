name: Deploy Website to dezender.de/GC via SFTP

on:
  push:
    branches: [ master ]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website-sftp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: SFTP Deploy /GC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare public marketing allowlist
        run: |
          set -euo pipefail
          install -d \
            public-site/assets/brand \
            public-site/assets/gui
          cp website/index.html public-site/index.html
          cp website/styles.css public-site/styles.css
          cp website/assets/brand/135er-grow-central-lockup-v0.9.png public-site/assets/brand/
          cp website/assets/brand/135er-grow-central-mark.png public-site/assets/brand/
          cp website/assets/gui/local-desktop-v0.9.png public-site/assets/gui/

      - name: Deploy public product website to /GC
        uses: wlixcc/SFTP-Deploy-Action@da88a4dbe95286266bbac3c0b2b8284048d20c8f # v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './public-site/*'
          remote_path: '/var/www/vhosts/dezender.de/httpdocs/GC/'
          delete_remote_files: true

      - name: Deployment information
        run: |
          echo '135er-Grow Central product website deployed to https://dezender.de/GC/'
          echo 'Only approved public marketing files were deployed'
