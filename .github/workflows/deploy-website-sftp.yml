name: Deploy Grow Central Website to grow-central.de via SFTP

on:
  push:
    branches: [ master ]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website-sftp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: SFTP Deploy Grow Central
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare public website allowlist
        run: |
          set -euo pipefail
          install -d \
            public-site/assets/brand \
            public-site/assets/gui \
            public-site/assets/hardware \
            public-site/downloads/3d \
            public-site/downloads/3d/profiles

          cp website/index.html public-site/index.html
          cp website/styles.css public-site/styles.css
          cp website/impressum.html public-site/impressum.html
          cp website/datenschutz.html public-site/datenschutz.html
          cp website/assets/brand/135er-grow-central-lockup-v0.9.png public-site/assets/brand/
          cp website/assets/brand/135er-grow-central-mark.png public-site/assets/brand/
          cp website/assets/gui/local-desktop-v0.9.png public-site/assets/gui/
          cp website/assets/hardware/rpi4-case-closed.png public-site/assets/hardware/
          cp website/assets/hardware/rpi4-case-gpio.png public-site/assets/hardware/
          cp website/assets/hardware/rpi4-case-service.png public-site/assets/hardware/
          cp website/downloads/3d/135er_Grow_Central_RPi4_bottom.stl public-site/downloads/3d/
          cp website/downloads/3d/135er_Grow_Central_RPi4_lid.stl public-site/downloads/3d/
          cp website/downloads/3d/135er_Grow_Central_RPi4_printplate.stl public-site/downloads/3d/
          cp website/downloads/3d/135er_Grow_Central_RPi4_case.scad public-site/downloads/3d/
          cp website/downloads/3d/135er_Grow_Central_RPi4_lid_gpio.stl public-site/downloads/3d/
          cp website/downloads/3d/135er_Grow_Central_RPi4_lid_service.stl public-site/downloads/3d/
          cp website/downloads/3d/135er_Grow_Central_RPi4_printplate_gpio.stl public-site/downloads/3d/
          cp website/downloads/3d/135er_Grow_Central_RPi4_printplate_service.stl public-site/downloads/3d/
          cp website/downloads/3d/profiles/135er_RPi4_Case_P2S_PETG_process.json public-site/downloads/3d/profiles/
          cp website/downloads/3d/profiles/135er_RPi4_Case_P2S_ASA_process.json public-site/downloads/3d/profiles/

      - name: Deploy Grow Central via native SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/growcentral_deploy
          chmod 600 ~/.ssh/growcentral_deploy

          ssh-keyscan -p "$SFTP_PORT" "$SFTP_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > /tmp/sftp-batch <<'EOF'
          cd /var/www/vhosts/grow-central.de/httpdocs
          -mkdir assets
          -mkdir assets/brand
          -mkdir assets/gui
          -mkdir assets/hardware
          -mkdir downloads
          -mkdir downloads/3d
          put public-site/index.html index.html
          put public-site/styles.css styles.css
          put public-site/impressum.html impressum.html
          put public-site/datenschutz.html datenschutz.html
          put public-site/assets/brand/135er-grow-central-lockup-v0.9.png assets/brand/135er-grow-central-lockup-v0.9.png
          put public-site/assets/brand/135er-grow-central-mark.png assets/brand/135er-grow-central-mark.png
          put public-site/assets/gui/local-desktop-v0.9.png assets/gui/local-desktop-v0.9.png
          put public-site/assets/hardware/rpi4-case-closed.png assets/hardware/rpi4-case-closed.png
          put public-site/assets/hardware/rpi4-case-gpio.png assets/hardware/rpi4-case-gpio.png
          put public-site/assets/hardware/rpi4-case-service.png assets/hardware/rpi4-case-service.png
          put public-site/downloads/3d/135er_Grow_Central_RPi4_bottom.stl downloads/3d/135er_Grow_Central_RPi4_bottom.stl
          put public-site/downloads/3d/135er_Grow_Central_RPi4_lid.stl downloads/3d/135er_Grow_Central_RPi4_lid.stl
          put public-site/downloads/3d/135er_Grow_Central_RPi4_printplate.stl downloads/3d/135er_Grow_Central_RPi4_printplate.stl
          put public-site/downloads/3d/135er_Grow_Central_RPi4_case.scad downloads/3d/135er_Grow_Central_RPi4_case.scad
          put public-site/downloads/3d/135er_Grow_Central_RPi4_lid_gpio.stl downloads/3d/135er_Grow_Central_RPi4_lid_gpio.stl
          put public-site/downloads/3d/135er_Grow_Central_RPi4_lid_service.stl downloads/3d/135er_Grow_Central_RPi4_lid_service.stl
          put public-site/downloads/3d/135er_Grow_Central_RPi4_printplate_gpio.stl downloads/3d/135er_Grow_Central_RPi4_printplate_gpio.stl
          put public-site/downloads/3d/135er_Grow_Central_RPi4_printplate_service.stl downloads/3d/135er_Grow_Central_RPi4_printplate_service.stl
          -mkdir downloads/3d/profiles
          put public-site/downloads/3d/profiles/135er_RPi4_Case_P2S_PETG_process.json downloads/3d/profiles/135er_RPi4_Case_P2S_PETG_process.json
          put public-site/downloads/3d/profiles/135er_RPi4_Case_P2S_ASA_process.json downloads/3d/profiles/135er_RPi4_Case_P2S_ASA_process.json
          bye
          EOF

          sftp \
            -i ~/.ssh/growcentral_deploy \
            -P "$SFTP_PORT" \
            -o BatchMode=yes \
            -b /tmp/sftp-batch \
            "$SFTP_USERNAME@$SFTP_HOST"

          rm -f ~/.ssh/growcentral_deploy /tmp/sftp-batch
