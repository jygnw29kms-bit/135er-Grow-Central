name: Deploy Website to dezender.de/GC via SFTP

on:
  push:
    branches: [ master ]
    paths:
      - 'website/**'
      - 'RELEASE_STATE.md'
      - 'docs/HARDWARE_SUPPORT_POLICY.md'
      - 'docs/DESIGN_SYSTEM_NEXUS.md'
      - '.github/workflows/deploy-website-sftp.yml'
      - 'scripts/install-135ercloud-v6.sh'
      - 'scripts/setup-135ercloud-apt-repo-v1.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: SFTP Deploy /GC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare downloadable release files
        run: |
          set -euo pipefail
          cp scripts/install-135ercloud-v6.sh website/135ercloud-server-install.sh
          cp scripts/setup-135ercloud-apt-repo-v1.sh website/setup-135ercloud-apt-repo.sh
          cp RELEASE_STATE.md website/RELEASE_STATE.md
          cp docs/HARDWARE_SUPPORT_POLICY.md website/HARDWARE_SUPPORT_POLICY.md
          sha256sum \
            website/135ercloud-server-install.sh \
            website/setup-135ercloud-apt-repo.sh \
            website/RELEASE_STATE.md \
            website/HARDWARE_SUPPORT_POLICY.md \
            > website/SHA256SUMS.txt
          {
            echo '135er-Grow Central release publication'
            echo 'version=alpha-0.7.5'
            echo 'image_strategy=universal-headless'
            echo 'pi3_support=SUPPORTED_LEGACY_LITE'
            echo 'pi4_support=FULL_SUPPORT'
            echo 'pi5_support=FULL_SUPPORT_PERFORMANCE'
            echo 'last_published_candidate=199'
            echo 'last_published_tag=pi-universal-alpha-0.7.5-199'
            echo 'candidate_commit=34442bc41d2c79328d3d5c61eb63a744f4c433a6'
            echo 'current_master_requires_new_image=false'
            echo 'status=CANDIDATE'
            echo 'runtime_mode=headless-local-first'
            echo 'kiosk=false'
            echo 'public_url=https://dezender.de/GC/'
            echo 'image_url=https://github.com/jygnw29kms-bit/135er-Grow-Central/releases/tag/pi-universal-alpha-0.7.5-199'
            echo 'ios_sideload_url=https://github.com/jygnw29kms-bit/135er-Grow-Central/actions/runs/33276409060/artifacts/9721641763'
            echo "published_commit=${GITHUB_SHA}"
          } > website/release-state.txt

      - name: Deploy website and server scripts to /GC
        uses: wlixcc/SFTP-Deploy-Action@da88a4dbe95286266bbac3c0b2b8284048d20c8f # v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './website/*'
          remote_path: '/var/www/vhosts/dezender.de/httpdocs/GC/'
          delete_remote_files: false

      - name: Deployment information
        run: |
          echo '135er-Grow Central product website deployed to https://dezender.de/GC/'
          echo 'Hardware Support Policy and canonical Release State republished'
          echo 'Architecture: headless/local-first; no kiosk runtime'
          echo 'Current published candidate: Build 199 / alpha-0.7.5'
          echo 'Target: /var/www/vhosts/dezender.de/httpdocs/GC/'
