name: Home Assistant integration
on:
  push:
    paths:
      - 'integrations/home_assistant/**'
      - '.github/workflows/home-assistant-integration.yml'
  pull_request:
    paths:
      - 'integrations/home_assistant/**'
      - '.github/workflows/home-assistant-integration.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - python: '3.12'
            home_assistant: '2025.1.4'
          - python: '3.14'
            home_assistant: '2026.10.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'homeassistant==${{ matrix.home_assistant }}' pytest pytest-asyncio
      - run: python -m pytest -q integrations/home_assistant/tests/runtime_checks.py
