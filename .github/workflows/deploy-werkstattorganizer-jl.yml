name: Deploy Workshop Manager JL Marketing

on:
  push:
    branches: [ master ]
    paths:
      - 'deploy/werkstattorganizer-jl/**'
      - '.github/workflows/deploy-werkstattorganizer-jl.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workshop-manager-jl-static
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy static /jl/ files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.SFTP_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || secrets.SFTP_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          : "${SSH_PORT:=22}"
          : "${SSH_HOST:?SSH_HOST/SFTP_HOST fehlt}"
          : "${SSH_USERNAME:?SSH_USERNAME fehlt}"
          : "${SSH_PASSWORD:?SSH_PASSWORD fehlt}"
          export SSHPASS="$SSH_PASSWORD"

          install -d -m 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          tar -C deploy/werkstattorganizer-jl -czf /tmp/workshop-jl.tar.gz .
          sshpass -e scp -P "$SSH_PORT" -o BatchMode=no /tmp/workshop-jl.tar.gz "$SSH_USERNAME@$SSH_HOST:/tmp/workshop-jl.tar.gz"

          SCRIPT='set -euo pipefail
          TARGET="/opt/etes-werkstattplaner/public/jl"
          STAGE="/opt/etes-werkstattplaner/public/.jl-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          tar -xzf /tmp/workshop-jl.tar.gz -C "$STAGE"
          test -f "$STAGE/index.html"
          test -f "$STAGE/styles.css"
          test -f "$STAGE/demo/index.html"
          test -f "$STAGE/demo/demo.css"
          test -f "$STAGE/demo/demo.js"
          rm -rf "$TARGET"
          mv "$STAGE" "$TARGET"
          rm -f /tmp/workshop-jl.tar.gz
          echo "Static files deployed without restarting the planner service."'

          B64="$(printf '%s' "$SCRIPT" | base64 -w0)"
          if sshpass -e ssh -p "$SSH_PORT" -o BatchMode=no "$SSH_USERNAME@$SSH_HOST" 'id -u' | grep -qx 0; then
            sshpass -e ssh -p "$SSH_PORT" -o BatchMode=no "$SSH_USERNAME@$SSH_HOST" "echo '$B64' | base64 -d | bash"
          else
            printf '%s\n' "$SSH_PASSWORD" | sshpass -e ssh -p "$SSH_PORT" -o BatchMode=no "$SSH_USERNAME@$SSH_HOST" "sudo -S -p '' bash -c \"echo '$B64' | base64 -d | bash\""
          fi

      - name: Deploy ERP staging backend
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.SFTP_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || secrets.SFTP_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          : "${SSH_PORT:=22}"
          export SSHPASS="$SSH_PASSWORD"

          install -d -m 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          tar -C deploy/workshop-erp-staging -czf /tmp/workshop-erp-staging.tar.gz .
          sshpass -e scp -P "$SSH_PORT" /tmp/workshop-erp-staging.tar.gz "$SSH_USERNAME@$SSH_HOST:/tmp/workshop-erp-staging.tar.gz"

          REMOTE='set -e
          rm -rf /tmp/workshop-erp-staging
          mkdir -p /tmp/workshop-erp-staging
          tar -xzf /tmp/workshop-erp-staging.tar.gz -C /tmp/workshop-erp-staging
          cd /tmp/workshop-erp-staging
          chmod +x install.sh
          ./install.sh'

          B64="$(printf '%s' "$REMOTE" | base64 -w0)"
          if sshpass -e ssh -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" 'id -u' | grep -qx 0; then
            sshpass -e ssh -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" "echo '$B64' | base64 -d | bash"
          else
            printf '%s\n' "$SSH_PASSWORD" | sshpass -e ssh -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" "sudo -S -p '' bash -c \"echo '$B64' | base64 -d | bash\""
          fi

      - name: Verify public URLs
        shell: bash
        run: |
          set -euo pipefail
          curl -LfsS https://werkstattplaner.grow-central.de/jl/ -o /tmp/jl.html
          grep -q "JL 1976" /tmp/jl.html

          curl -LfsS https://werkstattplaner.grow-central.de/jl/demo/ -o /tmp/demo.html
          grep -q "Workshop Manager ERP" /tmp/demo.html
          grep -q "STAGING" /tmp/demo.html
          curl -fsS https://werkstattplaner.grow-central.de/jl/demo/api/health -o /tmp/erp-health.json
          grep -q "Workshop Manager ERP" /tmp/erp-health.json

          echo "Marketingseite, ERP-Staging-GUI und API sind live."
