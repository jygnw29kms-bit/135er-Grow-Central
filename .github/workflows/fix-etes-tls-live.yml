name: Fix Etes TLS Live
on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/fix-etes-tls-live.yml'
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Issue and verify TLS certificate
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.SFTP_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || secrets.SFTP_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          : "${SSH_PORT:=22}"
          export SSHPASS="$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          SCRIPT='set -euo pipefail
          FQDN="werkstattplaner.grow-central.de"
          echo "=== ISSUE CERT ==="
          plesk ext sslit --certificate -issue -domain "$FQDN" -secure-domain
          echo "=== RECONFIGURE ==="
          plesk sbin httpdmng --reconfigure-domain "$FQDN"
          nginx -t
          systemctl reload nginx
          sleep 2
          echo "=== TLS VERIFY ==="
          echo | openssl s_client -connect "$FQDN:443" -servername "$FQDN" 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
          echo "=== PUBLIC LOGO ==="
          curl --http1.1 -fsSI "https://$FQDN/etes-logo.webp"
          curl --http1.1 -fsS -o /tmp/logo-check -w "HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download}\n" "https://$FQDN/etes-logo.webp"
          file /tmp/logo-check'
          B64="$(printf '%s' "$SCRIPT" | base64 -w0)"
          if sshpass -e ssh -p "$SSH_PORT" -o BatchMode=no "$SSH_USERNAME@$SSH_HOST" 'id -u' | grep -qx 0; then
            sshpass -e ssh -p "$SSH_PORT" -o BatchMode=no "$SSH_USERNAME@$SSH_HOST" "echo '$B64' | base64 -d | bash"
          else
            printf '%s\n' "$SSH_PASSWORD" | sshpass -e ssh -p "$SSH_PORT" -o BatchMode=no "$SSH_USERNAME@$SSH_HOST" "sudo -S -p '' bash -c \"echo '$B64' | base64 -d | bash\""
          fi
