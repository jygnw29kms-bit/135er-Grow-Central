name: Setup Etes Werkstattplaner Subdomain

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/setup-etes-werkstattplaner-subdomain.yml'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure Plesk subdomain and reverse proxy over SSH password
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.SFTP_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || secrets.SFTP_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          : "${SSH_PORT:=22}"
          export SSHPASS="$SSH_PASSWORD"

          install -d -m 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > /tmp/remote-setup.sh <<'REMOTE'
          set -euo pipefail

          PARENT="grow-central.de"
          SUB="werkstattplaner"
          FQDN="${SUB}.${PARENT}"

          echo "=== SERVICE CHECK ==="
          systemctl is-active etes-werkstattplaner
          curl -fsSI http://127.0.0.1:3080/ | head -20 || true

          echo "=== CREATE/CHECK PLESK SUBDOMAIN ==="
          if ! plesk bin subdomain --info "$FQDN" >/dev/null 2>&1; then
            plesk bin subdomain --create "$SUB" -domain "$PARENT" -www-root "/werkstattplaner" -php false
          fi

          CONF="/var/www/vhosts/system/${FQDN}/conf/vhost_nginx.conf"
          mkdir -p "$(dirname "$CONF")"

          cat > "$CONF" <<'NGINX'
          location @etes_werkstattplaner {
              proxy_pass http://127.0.0.1:3080;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_buffering off;
              proxy_cache off;
              proxy_read_timeout 3600s;
          }

          error_page 418 = @etes_werkstattplaner;
          recursive_error_pages on;
          if ($request_uri ~ "^/") {
              return 418;
          }
          NGINX

          plesk sbin httpdmng --reconfigure-domain "$FQDN"
          nginx -t
          systemctl reload nginx

          echo "=== PLESK SUBDOMAIN ==="
          plesk bin subdomain --info "$FQDN" || true

          echo "=== LOCAL VHOST TEST ==="
          curl -sS -I -H "Host: $FQDN" http://127.0.0.1/ | head -20 || true

          echo "=== WERKSTATTPLANER AUTH DEFAULTS ==="
          /usr/sbin/etes-werkstattplaner-user --help 2>&1 || true
          grep -RniE 'password|passwort|username|benutzer|admin|login|users' /opt/etes-werkstattplaner /etc/default/etes-werkstattplaner 2>/dev/null | head -120 || true
          echo "=== POSTINST ==="
          sed -n '1,220p' /var/lib/dpkg/info/etes-werkstattplaner.postinst 2>/dev/null || true
          echo "=== USERS ==="
          python3 - <<'PY'
import sqlite3,glob,os
dbs=glob.glob('/var/lib/etes-werkstattplaner/*')
for db in dbs:
    if os.path.isfile(db):
        try:
            con=sqlite3.connect(db)
            rows=list(con.execute("select name,role,active from users order by name"))
            if rows:
                print(db, rows)
        except Exception:
            pass
PY
          REMOTE

          SCRIPT_B64="$(base64 -w0 /tmp/remote-setup.sh)"

          if sshpass -e ssh -p "$SSH_PORT" -o BatchMode=no "$SSH_USERNAME@$SSH_HOST" 'id -u' | grep -qx '0'; then
            sshpass -e ssh -p "$SSH_PORT" -o BatchMode=no "$SSH_USERNAME@$SSH_HOST"               "echo '$SCRIPT_B64' | base64 -d | bash"
          else
            printf '%s\n' "$SSH_PASSWORD" | sshpass -e ssh -p "$SSH_PORT" -o BatchMode=no "$SSH_USERNAME@$SSH_HOST"               "sudo -S -p '' bash -c \"echo '$SCRIPT_B64' | base64 -d | bash\""
          fi

          rm -f /tmp/remote-setup.sh
