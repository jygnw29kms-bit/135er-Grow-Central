name: Setup Etes Werkstattplaner Subdomain

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/setup-etes-werkstattplaner-subdomain.yml'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure Plesk subdomain and reverse proxy
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/etes_ssh
          chmod 600 ~/.ssh/etes_ssh
          ssh-keyscan -p "$SFTP_PORT" "$SFTP_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/etes_ssh -p "$SFTP_PORT" -o BatchMode=yes "$SFTP_USERNAME@$SFTP_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail

          PARENT="grow-central.de"
          SUB="werkstattplaner"
          FQDN="${SUB}.${PARENT}"

          if ! plesk bin subdomain --info "$FQDN" >/dev/null 2>&1; then
            plesk bin subdomain --create "$SUB" -domain "$PARENT" -www-root "/werkstattplaner" -php false -ssl true
          fi

          CONF="/var/www/vhosts/system/${FQDN}/conf/vhost_nginx.conf"
          mkdir -p "$(dirname "$CONF")"

          cat > "$CONF" <<'NGINX'
          location @etes_werkstattplaner {
              proxy_pass http://127.0.0.1:3080;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Connection "";
              proxy_buffering off;
              proxy_cache off;
              proxy_read_timeout 3600s;
          }

          error_page 418 = @etes_werkstattplaner;
          recursive_error_pages on;
          if ($request_uri ~ "^/") {
              return 418;
          }
          NGINX

          plesk sbin httpdmng --reconfigure-domain "$FQDN"
          nginx -t
          systemctl reload nginx

          echo "=== PLESK SUBDOMAIN ==="
          plesk bin subdomain --info "$FQDN" || true
          echo "=== LOCAL PROXY TEST ==="
          curl -sS -I -H "Host: $FQDN" http://127.0.0.1/ | head -20 || true
          echo "=== SERVICE ==="
          systemctl is-active etes-werkstattplaner
          REMOTE

          rm -f ~/.ssh/etes_ssh
