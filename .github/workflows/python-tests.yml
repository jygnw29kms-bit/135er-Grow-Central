name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            cloud/requirements.txt
            local/cloud_link/requirements.txt
      - name: MQTT TLS integration prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mosquitto
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest flask
      - run: python -m pip check
      - run: python -m compileall -q app shared cloud local image-builder/firstboot
      - name: JavaScript syntax checks
        run: |
          node --check web/platform.js
          node --check web/mobile.js
          node --check web/room_views.js
          node --check web/usb_onboarding.js
          node --check web/sensor_pairing.js
          node --check mobile/www/app.js
      - name: Verify Grow project boundaries
        run: python scripts/check-grow-project-boundaries.py
      - run: python -m pytest -q
