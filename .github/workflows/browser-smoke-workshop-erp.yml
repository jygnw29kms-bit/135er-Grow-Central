name: Browser Smoke Test Workshop ERP Staging
# forced run 2026-09-24 cross-platform

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/browser-smoke-workshop-erp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium webkit

      - name: Test live ERP on desktop Android and iPhone class browsers
        shell: bash
        run: |
          cat > test.mjs <<'EOF'
          import { chromium, webkit, devices } from 'playwright';

          const targets = [
            {name:'Desktop Chromium', browser:chromium, context:{viewport:{width:1440,height:1000}}},
            {name:'Android Chromium', browser:chromium, context:{...devices['Pixel 7']}},
            {name:'iPhone WebKit', browser:webkit, context:{...devices['iPhone 15 Pro']}}
          ];

          let failed=false;
          for (const target of targets) {
            const browser=await target.browser.launch({headless:true});
            const context=await browser.newContext(target.context);
            const page=await context.newPage();
            const messages=[];
            page.on('console',m=>messages.push('console '+m.type()+': '+m.text()));
            page.on('pageerror',e=>messages.push('pageerror: '+e.message));
            page.on('requestfailed',r=>messages.push('requestfailed: '+r.url()+' '+(r.failure()?.errorText||'')));

            try {
              const url='https://werkstattplaner.grow-central.de/jl/demo/?smoke='+Date.now();
              const res=await page.goto(url,{waitUntil:'networkidle',timeout:60000});
              console.log('\n=== '+target.name+' ===');
              console.log('HTTP',res?.status(),'TITLE',await page.title());
              await page.waitForTimeout(4500);

              let appVisible=await page.locator('#appView').isVisible();
              if(!appVisible && await page.locator('#loginView').isVisible()) {
                await page.locator('#demoLoginBtn').click({timeout:10000});
                await page.waitForTimeout(3500);
                appVisible=await page.locator('#appView').isVisible();
              }

              console.log('APP VISIBLE',appVisible);
              console.log('API',await page.locator('#apiState').textContent());
              console.log('BODY CLASS',await page.locator('body').getAttribute('class'));

              const revenue=await page.locator('#reportRevenue').textContent();
              console.log('REVENUE',revenue);

              await page.evaluate(()=>document.querySelector('[data-page="planner"]')?.click());
              await page.waitForTimeout(400);
              console.log('PLANNER VISIBLE',await page.locator('#planner').isVisible());
              console.log('PLANNER CONTENT',await page.locator('#workshopPlannerGrid').innerText().then(x=>x.slice(0,180)));

              await page.evaluate(()=>document.querySelector('[data-page="personnel"]')?.click());
              await page.waitForTimeout(400);
              console.log('PERSONNEL VISIBLE',await page.locator('#personnel').isVisible());
              console.log('PERSONNEL PLANNER',await page.locator('#personnelPlannerGrid').innerText().then(x=>x.slice(0,180)));

              if(!appVisible || !revenue.includes('980.900')) failed=true;
              if(messages.some(m=>m.startsWith('pageerror:'))) failed=true;
              for(const m of messages) console.log(m);
            } catch(e) {
              console.error(target.name+' FAILED',e);
              failed=true;
            } finally {
              await browser.close();
            }
          }
          if(failed) process.exit(2);
          EOF
          node test.mjs
