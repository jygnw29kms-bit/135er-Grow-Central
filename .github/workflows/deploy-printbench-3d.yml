name: Deploy PRINTBENCH 3D Druck

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/deploy-printbench-3d.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current 3d-Files
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/jygnw29kms-bit/3d-Files.git printbench
          cd printbench
          php -l index.php
          php -l ingest.php
          php -l live-data.php
          mkdir -p ../dist
          cp index.php ingest.php live-data.php media-ingest.php media-data.php final-master.css final-master.js api.php ../dist/
          cp -a assets Druckkosten-Rechner LST-Klammer LST-Clips ../dist/
          cp -a Druckkosten-Rechner/data ../dist/data

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Create PRINTBENCH webroot
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh -p "${{ secrets.SFTP_PORT }}" -o StrictHostKeyChecking=no "${{ secrets.SSH_USERNAME }}@${{ secrets.SFTP_HOST }}" "mkdir -p /var/www/vhosts/dezender.de/httpdocs/3d-druck/runtime && chmod 733 /var/www/vhosts/dezender.de/httpdocs/3d-druck/runtime && rm -f /var/www/vhosts/dezender.de/httpdocs/3d-druck/index.html"

      - name: Deploy PRINTBENCH with Grow Central SSH secrets
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e scp -P "${{ secrets.SFTP_PORT }}" -o StrictHostKeyChecking=no -r dist/* "${{ secrets.SSH_USERNAME }}@${{ secrets.SFTP_HOST }}:/var/www/vhosts/dezender.de/httpdocs/3d-druck/"

      - name: Verify final master live page and API
        run: |
          set -euo pipefail
          sleep 5
          PAGE="$(curl --fail --retry 8 --retry-delay 3 https://www.dezender.de/3d-druck/)"
          echo "$PAGE" | grep -q 'DEZENDER'
          echo "$PAGE" | grep -q 'BAMBU LAB P2S'
          echo "$PAGE" | grep -q 'final-master.css'
          curl --fail --retry 8 --retry-delay 3 -o /tmp/final-master.js https://www.dezender.de/3d-druck/final-master.js
          grep -q 'LIVE_ENDPOINT' /tmp/final-master.js
          test "$(curl -s -o /dev/null -w '%{http_code}' https://www.dezender.de/3d-druck/media-data.php)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' https://www.dezender.de/3d-druck/media-ingest.php)" = "405"
          test "$(curl -s -o /dev/null -w '%{http_code}' https://www.dezender.de/3d-druck/ingest.php)" = "405"
          echo 'LIVE=https://www.dezender.de/3d-druck/'

