name: Deploy PRINTBENCH 3D Druck

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/deploy-printbench-3d.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current 3d-Files
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/jygnw29kms-bit/3d-Files.git printbench
          cd printbench
          php -l index.php
          php -l api.php
          mkdir -p ../dist
          cp index.php index.html api.php site.css hightech.css site.js workbench.js ../dist/
          cp -a Druckkosten-Rechner LST-Klammer LST-Clips ../dist/

      - name: Deploy PRINTBENCH to dezender.de/3d-druck
        uses: wlixcc/SFTP-Deploy-Action@da88a4dbe95286266bbac3c0b2b8284048d20c8f
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './dist/*'
          remote_path: '/var/www/vhosts/dezender.de/httpdocs/3d-druck/'
          delete_remote_files: true

      - name: Verify live PHP and API
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --retry 8 --retry-delay 3 https://www.dezender.de/3d-druck/index.php | grep -q '3D PRINT'
          curl --fail --retry 8 --retry-delay 3 https://www.dezender.de/3d-druck/api.php | grep -q 'PRINTBENCH'
          echo 'LIVE=https://www.dezender.de/3d-druck/'
