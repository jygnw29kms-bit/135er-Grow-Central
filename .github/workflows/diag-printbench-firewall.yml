name: Diagnose PRINTBENCH firewall

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect and temporarily unban collector IP
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh -p "${{ secrets.SFTP_PORT }}" -o StrictHostKeyChecking=no "${{ secrets.SSH_USERNAME }}@${{ secrets.SFTP_HOST }}" '
            IP="95.90.247.104"
            echo "=== ID ==="; id
            echo "=== PLESK MODSECURITY JAIL ==="; fail2ban-client status plesk-modsecurity || true
            echo "=== FAIL2BAN EVENTS ==="; grep -F "$IP" /var/log/fail2ban.log 2>/dev/null | tail -30 || true
            echo "=== VHOST / MODSECURITY LOG MATCHES ==="
            grep -R -n -F "$IP" /var/www/vhosts/system/dezender.de/logs /var/log/modsec* /var/log/apache2 2>/dev/null | tail -100 || true
            echo "=== UNBAN ==="; fail2ban-client set plesk-modsecurity unbanip "$IP" || true
            fail2ban-client set plesk-modsecurity addignoreip "$IP" || true
            echo "=== STATUS AFTER ==="; fail2ban-client status plesk-modsecurity || true
          '
