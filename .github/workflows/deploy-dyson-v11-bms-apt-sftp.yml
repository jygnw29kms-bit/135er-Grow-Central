name: Deploy Dyson Service Center APT repo to dezender.de

on:
  push:
    branches: [ master ]
    paths:
      - 'standalone/dyson-v11-bms-apt-deploy/**'
      - 'standalone/dyson-v11-bms-pi3-image-builder/**'
      - '.github/workflows/deploy-dyson-v11-bms-apt-sftp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dyson-v11-bms-apt-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, test and deploy signed APT repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DYSON_SITE_PATH: /var/www/vhosts/dezender.de/httpdocs/dyson-v11-bms
      DYSON_PRIVATE_KEY_DIR: /var/www/vhosts/dezender.de/httpdocs/dyson-v11-bms/.apt-signing
      DYSON_PRIVATE_KEY_PATH: /var/www/vhosts/dezender.de/httpdocs/dyson-v11-bms/.apt-signing/dyson-v11-bms-apt-signing-key.pgp.enc
      DYSON_PRIVATE_KEY_URL: https://dezender.de/dyson-v11-bms/.apt-signing/dyson-v11-bms-apt-signing-key.pgp.enc

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install repository tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apt-utils dpkg-dev gnupg openssl openssh-client sshpass sq

      - name: Restore or create persistent signing key
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          DEDICATED_KEY_PASSWORD: ${{ secrets.DYSON_APT_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$SFTP_HOST"
          test -n "$SFTP_USERNAME"
          test -n "$SSHPASS"

          signing_key="$RUNNER_TEMP/dyson-v11-bms-apt-signing-key.pgp"
          encrypted_key="$RUNNER_TEMP/dyson-v11-bms-apt-signing-key.pgp.enc"
          downloaded_copy="$RUNNER_TEMP/dyson-v11-bms-apt-signing-key.persisted.enc"
          sftp_batch="$RUNNER_TEMP/dyson-sftp.batch"
          deny_file="$RUNNER_TEMP/dyson-signing-deny.htaccess"
          remote_temporary="${DYSON_PRIVATE_KEY_PATH}.tmp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          key_password="${DEDICATED_KEY_PASSWORD:-$SSHPASS}"
          export DYSON_APT_KEY_PASSWORD_VALUE="$key_password"

          run_sftp() {
            sshpass -e sftp \
              -P 22 \
              -oBatchMode=no \
              -oStrictHostKeyChecking=accept-new \
              -b "$1" \
              "${SFTP_USERNAME}@${SFTP_HOST}"
          }

          # A successful connection check is required before a missing key may
          # trigger first-time generation. Network errors must never rotate it.
          printf 'pwd\n' > "$sftp_batch"
          run_sftp "$sftp_batch" >/dev/null

          printf 'Require all denied\n' > "$deny_file"
          printf -- '-mkdir %s\nput %s %s/.htaccess\n' \
            "$DYSON_PRIVATE_KEY_DIR" "$deny_file" "$DYSON_PRIVATE_KEY_DIR" > "$sftp_batch"
          run_sftp "$sftp_batch" >/dev/null

          printf 'get %s %s\n' "$DYSON_PRIVATE_KEY_PATH" "$encrypted_key" > "$sftp_batch"
          if run_sftp "$sftp_batch" >/dev/null 2>&1; then
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
              -pass env:DYSON_APT_KEY_PASSWORD_VALUE \
              -in "$encrypted_key" -out "$signing_key"; then
              echo "Gespeicherter APT-Schlüssel konnte nicht entschlüsselt werden; Abbruch ohne Schlüsselwechsel." >&2
              exit 1
            fi
            echo "Bestehender, verschlüsselter APT-Signierschlüssel geladen."
          else
            printf 'pwd\n' > "$sftp_batch"
            run_sftp "$sftp_batch" >/dev/null

            sq key generate \
              --no-cert-store \
              --userid 'Dyson V11 BMS APT <apt@dezender.de>' \
              --cipher-suite rsa3k \
              --expiry never \
              --can-sign \
              --cannot-authenticate \
              --cannot-encrypt \
              --output "$signing_key"
            chmod 0600 "$signing_key"
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -md sha256 \
              -pass env:DYSON_APT_KEY_PASSWORD_VALUE \
              -in "$signing_key" -out "$encrypted_key"

            printf -- '-mkdir %s\nput %s %s\nrename %s %s\n' \
              "$DYSON_PRIVATE_KEY_DIR" \
              "$encrypted_key" "$remote_temporary" \
              "$remote_temporary" "$DYSON_PRIVATE_KEY_PATH" > "$sftp_batch"
            run_sftp "$sftp_batch" >/dev/null

            printf 'get %s %s\n' "$DYSON_PRIVATE_KEY_PATH" "$downloaded_copy" > "$sftp_batch"
            run_sftp "$sftp_batch" >/dev/null
            cmp --silent "$encrypted_key" "$downloaded_copy"
            echo "Neuer APT-Signierschlüssel verschlüsselt außerhalb des Webroots gesichert."
          fi

          chmod 0600 "$signing_key"
          public_check="$RUNNER_TEMP/dyson-signing-key-check.asc"
          signature_check="$RUNNER_TEMP/dyson-signing-key-check.sig"
          message_check="$RUNNER_TEMP/dyson-signing-key-check.txt"
          printf 'dyson-v11-bms signing check\n' > "$message_check"
          sq key extract-cert --force --no-cert-store \
            --output "$public_check" "$signing_key"
          sq sign --force --no-cert-store --detached \
            --signer-file "$signing_key" \
            --output "$signature_check" "$message_check"
          binary_key="$RUNNER_TEMP/dyson-signing-key-check.gpg"
          gpg --batch --yes --dearmor --output "$binary_key" "$public_check"
          gpgv --keyring "$binary_key" "$signature_check" "$message_check"

          private_http_status="$(curl -sS --connect-timeout 10 --max-time 20 \
            -o /dev/null -w '%{http_code}' "$DYSON_PRIVATE_KEY_URL")"
          case "$private_http_status" in
            401|403|404) ;;
            *)
              echo "Geschützter Schlüsselspeicher ist per HTTP erreichbar (Status $private_http_status); Abbruch." >&2
              exit 1
              ;;
          esac

          fingerprint="$(gpg --batch --show-keys --with-colons "$public_check" \
            | awk -F: '$1 == "fpr" && !fingerprint {fingerprint = $10} END {print fingerprint}')"
          test "${#fingerprint}" -eq 40
          {
            echo "DYSON_APT_SIGNING_KEY_FILE=$signing_key"
            echo "DYSON_APT_SIGNING_FINGERPRINT=$fingerprint"
          } >> "$GITHUB_ENV"
          echo "APT-Signierschlüssel geprüft: $fingerprint"

      - name: Build signed repository
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            standalone/dyson-v11-bms-apt-deploy/build-current-package.sh \
            standalone/dyson-v11-bms-apt-deploy/build-signed-repository.sh
          install -d -m 0755 apt-deploy-output
          standalone/dyson-v11-bms-apt-deploy/build-signed-repository.sh apt-deploy-output

      - name: Prove APT update and upgrade path
        shell: bash
        run: |
          set -euo pipefail
          apt_root="$RUNNER_TEMP/dyson-apt-client"
          install -d -m 0755 \
            "$apt_root/lists/partial" \
            "$apt_root/cache/archives/partial" \
            "$apt_root/download"
          printf 'deb [arch=armhf signed-by=%s/apt-deploy-output/repo-key.asc] file:%s/apt-deploy-output/apt stable main\n' \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" > "$apt_root/sources.list"

          printf 'Package: dyson-v11-bms\nStatus: install ok installed\nArchitecture: all\nVersion: 0.2.0-1\n\n' \
            > "$apt_root/status"
          for dependency in python3 python3-flask can-utils iproute2 openocd git cmake make gcc-arm-none-eabi; do
            printf 'Package: %s\nStatus: install ok installed\nArchitecture: all\nVersion: 1:999\n\n' \
              "$dependency" >> "$apt_root/status"
          done

          apt_options=(
            -o APT::Architecture=armhf
            -o APT::Architectures::=armhf
            -o APT::Sandbox::User=root
            -o Debug::NoLocking=1
            -o Dir::Etc::sourcelist="$apt_root/sources.list"
            -o Dir::Etc::sourceparts=-
            -o Dir::State::status="$apt_root/status"
            -o Dir::State::lists="$apt_root/lists"
            -o Dir::Cache::archives="$apt_root/cache/archives"
            -o Dir::Cache::pkgcache=
            -o Dir::Cache::srcpkgcache=
            -o APT::Get::List-Cleanup=0
          )

          apt-get "${apt_options[@]}" update
          apt-cache "${apt_options[@]}" policy dyson-v11-bms | tee "$apt_root/policy.log"
          grep -q '^  Installed: 0.2.0-1$' "$apt_root/policy.log"
          grep -q '^  Candidate: 0.3.0-1$' "$apt_root/policy.log"

          apt-get "${apt_options[@]}" --simulate upgrade | tee "$apt_root/upgrade.log"
          grep -Eq '^Inst dyson-v11-bms \[0\.2\.0-1\] \(0\.3\.0-1 ' "$apt_root/upgrade.log"

          (
            cd "$apt_root/download"
            apt-get "${apt_options[@]}" download dyson-v11-bms
          )
          downloaded="$apt_root/download/dyson-v11-bms_0.3.0-1_all.deb"
          test -f "$downloaded"
          test "$(dpkg-deb -f "$downloaded" Version)" = 0.3.0-1
          expected_sha="$(sed -n 's/^SHA256: //p' \
            apt-deploy-output/apt/dists/stable/main/binary-armhf/Packages)"
          echo "$expected_sha  $downloaded" | sha256sum -c -

      - name: Prepare ordered deployment stages
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 \
            apt-deploy-stages/data/apt/dists/stable \
            apt-deploy-stages/bootstrap \
            apt-deploy-stages/release/apt/dists/stable \
            apt-deploy-stages/inrelease/apt/dists/stable
          cp -a apt-deploy-output/apt/pool apt-deploy-stages/data/apt/
          cp -a apt-deploy-output/apt/dists/stable/main apt-deploy-stages/data/apt/dists/stable/
          cp -a apt-deploy-output/downloads apt-deploy-stages/data/
          cp -a \
            apt-deploy-output/install.sh \
            apt-deploy-output/update.sh \
            apt-deploy-output/repo-key.asc \
            apt-deploy-output/repo-info.json \
            apt-deploy-output/README.txt \
            apt-deploy-stages/bootstrap/
          cp -a \
            apt-deploy-output/apt/dists/stable/Release \
            apt-deploy-output/apt/dists/stable/Release.gpg \
            apt-deploy-stages/release/apt/dists/stable/
          cp -a apt-deploy-output/apt/dists/stable/InRelease \
            apt-deploy-stages/inrelease/apt/dists/stable/

      # Upload immutable package/index data first and InRelease last. Together
      # with Acquire-By-Hash this prevents partially published APT snapshots.
      - name: Deploy package and index data
        uses: wlixcc/SFTP-Deploy-Action@da88a4dbe95286266bbac3c0b2b8284048d20c8f # v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './apt-deploy-stages/data/*'
          remote_path: '/var/www/vhosts/dezender.de/httpdocs/dyson-v11-bms/'
          delete_remote_files: false

      - name: Deploy repository key and bootstrap scripts
        uses: wlixcc/SFTP-Deploy-Action@da88a4dbe95286266bbac3c0b2b8284048d20c8f # v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './apt-deploy-stages/bootstrap/*'
          remote_path: '/var/www/vhosts/dezender.de/httpdocs/dyson-v11-bms/'
          delete_remote_files: false

      - name: Deploy detached release metadata
        uses: wlixcc/SFTP-Deploy-Action@da88a4dbe95286266bbac3c0b2b8284048d20c8f # v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './apt-deploy-stages/release/*'
          remote_path: '/var/www/vhosts/dezender.de/httpdocs/dyson-v11-bms/'
          delete_remote_files: false

      - name: Publish signed InRelease last
        uses: wlixcc/SFTP-Deploy-Action@da88a4dbe95286266bbac3c0b2b8284048d20c8f # v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './apt-deploy-stages/inrelease/*'
          remote_path: '/var/www/vhosts/dezender.de/httpdocs/dyson-v11-bms/'
          delete_remote_files: false

      - name: Verify public repository and upgrade candidate
        shell: bash
        run: |
          set -euo pipefail
          cache_buster="run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          public_root="$RUNNER_TEMP/dyson-public-repository"
          install -d -m 0755 \
            "$public_root/lists/partial" \
            "$public_root/cache/archives/partial"

          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "https://dezender.de/dyson-v11-bms/repo-info.json?${cache_buster}" \
              -o "$public_root/repo-info.json" && \
               grep -q '"version": "0.3.0-1"' "$public_root/repo-info.json"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Öffentliches Repository meldet nicht Version 0.3.0-1" >&2
              exit 1
            fi
            sleep 5
          done

          curl -fsSL "https://dezender.de/dyson-v11-bms/repo-key.asc?${cache_buster}" \
            -o "$public_root/repo-key.asc"
          curl -fsSL "https://dezender.de/dyson-v11-bms/apt/dists/stable/InRelease?${cache_buster}" \
            -o "$public_root/InRelease"
          curl -fsSL "https://dezender.de/dyson-v11-bms/update.sh?${cache_buster}" \
            -o "$public_root/update.sh"
          bash -n "$public_root/update.sh"
          grep -Fq 'sudo apt update && sudo apt upgrade' "$public_root/update.sh"

          public_keyring="$public_root/repo-key.gpg"
          gpg --batch --yes --dearmor --output "$public_keyring" "$public_root/repo-key.asc"
          gpgv --keyring "$public_keyring" "$public_root/InRelease"

          printf 'deb [arch=armhf signed-by=%s/repo-key.asc] https://dezender.de/dyson-v11-bms/apt stable main\n' \
            "$public_root" > "$public_root/sources.list"
          printf 'Package: dyson-v11-bms\nStatus: install ok installed\nArchitecture: all\nVersion: 0.2.0-1\n\n' \
            > "$public_root/status"
          for dependency in python3 python3-flask can-utils iproute2 openocd git cmake make gcc-arm-none-eabi; do
            printf 'Package: %s\nStatus: install ok installed\nArchitecture: all\nVersion: 1:999\n\n' \
              "$dependency" >> "$public_root/status"
          done

          apt_options=(
            -o APT::Architecture=armhf
            -o APT::Architectures::=armhf
            -o APT::Sandbox::User=root
            -o Debug::NoLocking=1
            -o Acquire::Retries=3
            -o Dir::Etc::sourcelist="$public_root/sources.list"
            -o Dir::Etc::sourceparts=-
            -o Dir::State::status="$public_root/status"
            -o Dir::State::lists="$public_root/lists"
            -o Dir::Cache::archives="$public_root/cache/archives"
            -o Dir::Cache::pkgcache=
            -o Dir::Cache::srcpkgcache=
            -o APT::Get::List-Cleanup=0
          )
          apt-get "${apt_options[@]}" update
          apt-cache "${apt_options[@]}" policy dyson-v11-bms | tee "$public_root/policy.log"
          grep -q '^  Installed: 0.2.0-1$' "$public_root/policy.log"
          grep -q '^  Candidate: 0.3.0-1$' "$public_root/policy.log"
          apt-get "${apt_options[@]}" --simulate upgrade | tee "$public_root/upgrade.log"
          grep -Eq '^Inst dyson-v11-bms \[0\.2\.0-1\] \(0\.3\.0-1 ' "$public_root/upgrade.log"
          echo 'Öffentliches APT-Repository: Update und Upgrade auf 0.3.0-1 geprüft.'
