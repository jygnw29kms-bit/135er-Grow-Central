name: Bootstrap Test Pi SSH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, ARM64, growcentral, test-pi]
    timeout-minutes: 5
    steps:
      - name: Install maintenance public key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          KEY='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOFgt6Zip2lQTdOjdhEmHlDLx6odgambMnG1Zce9pXS1 ChatGPT-GrowCentral-maintenance'
          grep -Fqx "$KEY" "$HOME/.ssh/authorized_keys" || printf '%s\n' "$KEY" >> "$HOME/.ssh/authorized_keys"
          systemctl --user daemon-reload
          systemctl --user restart desktop-commander-remote.service || true
          echo SSH_BOOTSTRAP_OK
