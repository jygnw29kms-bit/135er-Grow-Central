name: Inspect Etes Logo
on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/inspect-etes-logo.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect official Etes Autoservice assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://www.etes-autoservice.de/ -o /tmp/etes.html
          python3 - <<'PY'
          import re, html
          s=open('/tmp/etes.html',encoding='utf-8',errors='ignore').read()
          vals=[]
          for m in re.finditer(r'<img\b[^>]*>',s,re.I):
              tag=m.group(0)
              src=re.search(r'\bsrc=["\']([^"\']+)',tag,re.I)
              alt=re.search(r'\balt=["\']([^"\']*)',tag,re.I)
              if src:
                  vals.append((html.unescape(src.group(1)), html.unescape(alt.group(1)) if alt else ''))
          for src,alt in vals[:80]:
              print(f'IMG {src} ALT={alt}')
          PY
