name: Native soil sensor firmware
on:
  push:
    branches: [master, "feature/**"]
    paths:
      - 'firmware/gc-soil-node/**'
      - '.github/workflows/gc-soil-firmware.yml'
  pull_request:
    paths:
      - 'firmware/gc-soil-node/**'
      - '.github/workflows/gc-soil-firmware.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: python -m platformio run -d firmware/gc-soil-node
