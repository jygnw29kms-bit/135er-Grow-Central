name: Deploy 135erHeli.de portfolio

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-135erheli]
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-135erheli-portfolio.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 135erHeli website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jygnw29kms-bit/135erHeli-Website
          ref: main
          path: site

      - name: Deploy approved visual master to Plesk
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.SFTP_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || secrets.SFTP_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          : "${SSH_PORT:=22}"
          : "${SSH_HOST:?SSH_HOST/SFTP_HOST fehlt}"
          : "${SSH_USERNAME:?SSH_USERNAME fehlt}"
          : "${SSH_PASSWORD:?SSH_PASSWORD fehlt}"
          export SSHPASS="$SSH_PASSWORD"

          tar -C site -czf /tmp/135erheli-site.tar.gz index.html styles.css app.js assets
          test -s /tmp/135erheli-site.tar.gz

          REMOTE_HOME="$(sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USERNAME@$SSH_HOST" 'printf "%s" "$HOME"')"
          test -n "$REMOTE_HOME"
          REMOTE_ARCHIVE="$REMOTE_HOME/135erheli-site.tar.gz"
          sshpass -e scp -P "$SSH_PORT" -o StrictHostKeyChecking=no /tmp/135erheli-site.tar.gz "$SSH_USERNAME@$SSH_HOST:$REMOTE_ARCHIVE"
          sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USERNAME@$SSH_HOST" "test -s '$REMOTE_ARCHIVE'"

          REMOTE='set -euo pipefail
          ARCHIVE="$1"
          FQDN="135erheli.de"
          TARGET="/var/www/vhosts/$FQDN/httpdocs"
          STAGE="/var/tmp/135erheli-stage"
          BACKUP="/var/tmp/135erheli-backup-$(date +%Y%m%d-%H%M%S)"

          test -s "$ARCHIVE"
          command -v plesk >/dev/null
          plesk bin site --update "$FQDN" -www-root httpdocs -seo-redirect non-www
          plesk sbin httpdmng --reconfigure-domain "$FQDN"
          test -d "$TARGET"

          OWNER="$(stat -c %U "$TARGET")"
          GROUP="$(stat -c %G "$TARGET")"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          tar -xzf "$ARCHIVE" -C "$STAGE"
          test -s "$STAGE/index.html"
          test -s "$STAGE/assets/135erheli-final-master.png"
          grep -q "135erheli-final-visual" "$STAGE/index.html"

          mkdir -p "$BACKUP"
          cp -a "$TARGET"/. "$BACKUP"/ 2>/dev/null || true

          find "$TARGET" -mindepth 1 -maxdepth 1 \
            ! -name .well-known \
            ! -name web.config \
            -exec rm -rf {} +

          install -m 0644 -o "$OWNER" -g "$GROUP" "$STAGE/index.html" "$TARGET/index.html"
          install -m 0644 -o "$OWNER" -g "$GROUP" "$STAGE/styles.css" "$TARGET/styles.css"
          install -m 0644 -o "$OWNER" -g "$GROUP" "$STAGE/app.js" "$TARGET/app.js"
          install -m 0755 -o "$OWNER" -g "$GROUP" -d "$TARGET/assets"
          cp -a "$STAGE/assets"/. "$TARGET/assets"/
          chown -R "$OWNER:$GROUP" "$TARGET/assets"
          find "$TARGET/assets" -type d -exec chmod 0755 {} +
          find "$TARGET/assets" -type f -exec chmod 0644 {} +

          plesk sbin httpdmng --reconfigure-domain "$FQDN"
          nginx -t
          systemctl reload nginx

          test -s "$TARGET/index.html"
          test -s "$TARGET/assets/135erheli-final-master.png"
          grep -q "135erheli-final-visual" "$TARGET/index.html"
          rm -rf "$STAGE" "$ARCHIVE"'

          SCRIPT_B64="$(printf '%s' "$REMOTE" | base64 -w0)"
          if sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USERNAME@$SSH_HOST" 'id -u' | grep -qx 0; then
            sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USERNAME@$SSH_HOST" "echo '$SCRIPT_B64' | base64 -d | bash -s -- '$REMOTE_ARCHIVE'"
          else
            printf '%s\n' "$SSH_PASSWORD" | sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USERNAME@$SSH_HOST" "sudo -S -p '' bash -c \"echo '$SCRIPT_B64' | base64 -d | bash -s -- '$REMOTE_ARCHIVE'\""
          fi

      - name: Verify live website
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if curl --http1.1 -LfsS https://135erheli.de/ -o /tmp/135erheli.html \
              && grep -q '135erheli-final-visual' /tmp/135erheli.html \
              && curl --http1.1 -LfsS https://135erheli.de/assets/135erheli-final-master.png -o /tmp/135erheli-final-master.png \
              && test "$(stat -c %s /tmp/135erheli-final-master.png)" -gt 2500000; then
              echo '135erHeli.de approved visual master is live.'
              exit 0
            fi
            sleep 5
          done
          echo 'Live verification failed.' >&2
          exit 1