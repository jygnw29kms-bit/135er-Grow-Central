name: Deploy 135erHeli.de portfolio

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/deploy-135erheli-portfolio.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-135erheli]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 135erHeli website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jygnw29kms-bit/135erHeli-Website
          ref: main
          path: site

      - name: Configure Plesk site and deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.SFTP_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || secrets.SFTP_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          : "${SSH_PORT:=22}"
          : "${SSH_HOST:?SSH_HOST/SFTP_HOST fehlt}"
          : "${SSH_USERNAME:?SSH_USERNAME fehlt}"
          : "${SSH_PASSWORD:?SSH_PASSWORD fehlt}"
          export SSHPASS="$SSH_PASSWORD"

          tar -C site -czf /tmp/135erheli-site.tar.gz index.html styles.css app.js assets
          sshpass -e scp -P "$SSH_PORT" -o StrictHostKeyChecking=no /tmp/135erheli-site.tar.gz "$SSH_USERNAME@$SSH_HOST:/tmp/135erheli-site.tar.gz"

          REMOTE='set -euo pipefail
          FQDN="135erheli.de"
          TARGET="/var/www/vhosts/$FQDN/httpdocs"

          command -v plesk >/dev/null
          echo "== Plesk site before =="
          plesk bin site --info "$FQDN"

          # Keep hosting under Plesk control; only enforce the document root and canonical host.
          plesk bin site --update "$FQDN" -www-root httpdocs -seo-redirect non-www
          plesk sbin httpdmng --reconfigure-domain "$FQDN"

          test -d "$TARGET"
          OWNER="$(stat -c %U "$TARGET")"
          GROUP="$(stat -c %G "$TARGET")"
          echo "Plesk webroot: $TARGET ($OWNER:$GROUP)"

          rm -rf /tmp/135erheli-stage
          mkdir -p /tmp/135erheli-stage
          tar -xzf /tmp/135erheli-site.tar.gz -C /tmp/135erheli-stage

          find "$TARGET" -mindepth 1 -maxdepth 1 \
            ! -name .well-known \
            ! -name web.config \
            -exec rm -rf {} +

          install -m 0755 -o "$OWNER" -g "$GROUP" -d "$TARGET/assets"
          install -m 0644 -o "$OWNER" -g "$GROUP" /tmp/135erheli-stage/index.html "$TARGET/index.html"
          install -m 0644 -o "$OWNER" -g "$GROUP" /tmp/135erheli-stage/styles.css "$TARGET/styles.css"
          install -m 0644 -o "$OWNER" -g "$GROUP" /tmp/135erheli-stage/app.js "$TARGET/app.js"
          cp -a /tmp/135erheli-stage/assets/. "$TARGET/assets/"
          chown -R "$OWNER:$GROUP" "$TARGET/assets"
          find "$TARGET/assets" -type d -exec chmod 0755 {} +
          find "$TARGET/assets" -type f -exec chmod 0644 {} +

          plesk sbin httpdmng --reconfigure-domain "$FQDN"
          nginx -t
          systemctl reload nginx

          echo "== Plesk site after =="
          plesk bin site --info "$FQDN"
          ls -la "$TARGET"
          test -s "$TARGET/index.html"
          grep -q "RAW CITY HARDWARE" "$TARGET/index.html"

          rm -rf /tmp/135erheli-stage /tmp/135erheli-site.tar.gz'

          B64="$(printf '%s' "$REMOTE" | base64 -w0)"
          if sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USERNAME@$SSH_HOST" 'id -u' | grep -qx 0; then
            sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USERNAME@$SSH_HOST" "echo '$B64' | base64 -d | bash"
          else
            printf '%s\n' "$SSH_PASSWORD" | sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USERNAME@$SSH_HOST" "sudo -S -p '' bash -c \"echo '$B64' | base64 -d | bash\""
          fi

      - name: Verify live website
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if curl --http1.1 -LfsS https://135erheli.de/ -o /tmp/135erheli.html \
              && grep -q 'RAW CITY HARDWARE' /tmp/135erheli.html \
              && curl --http1.1 -LfsS https://135erheli.de/assets/hero-homebrew.svg -o /tmp/hero.svg \
              && grep -q 'JL1976' /tmp/hero.svg; then
              echo '135erHeli.de Plesk site is live.'
              exit 0
            fi
            sleep 5
          done
          echo 'Live verification failed.' >&2
          exit 1

