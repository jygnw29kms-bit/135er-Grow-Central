name: Deploy 135erHeli.de portfolio

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-135erheli]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 135erHeli website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jygnw29kms-bit/135erHeli-Website
          ref: main
          path: site

      - name: Deploy via existing authorized SFTP channel
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SFTP_HOST"
          test -n "$SFTP_USERNAME"
          test -n "$SFTP_PORT"
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/135erheli_deploy
          chmod 600 ~/.ssh/135erheli_deploy
          ssh-keyscan -p "$SFTP_PORT" "$SFTP_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > /tmp/sftp-batch <<'EOF'
          cd /var/www/vhosts/135erheli.de/httpdocs
          put site/index.html index.html
          put site/styles.css styles.css
          put site/app.js app.js
          bye
          EOF
          sftp -i ~/.ssh/135erheli_deploy -P "$SFTP_PORT" -o BatchMode=yes -b /tmp/sftp-batch "$SFTP_USERNAME@$SFTP_HOST"
          rm -f ~/.ssh/135erheli_deploy /tmp/sftp-batch
