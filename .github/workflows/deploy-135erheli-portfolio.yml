name: Deploy 135erHeli.de portfolio

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-135erheli]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 135erHeli website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jygnw29kms-bit/135erHeli-Website
          ref: main
          path: site

      - name: Deploy through existing dezender server access
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.SFTP_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || secrets.SFTP_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          : "${SSH_PORT:=22}"
          : "${SSH_HOST:?SSH_HOST/SFTP_HOST fehlt}"
          : "${SSH_USERNAME:?SSH_USERNAME fehlt}"
          : "${SSH_PASSWORD:?SSH_PASSWORD fehlt}"
          export SSHPASS="$SSH_PASSWORD"

          tar -C site -czf /tmp/135erheli-site.tar.gz index.html styles.css app.js
          sshpass -e scp -P "$SSH_PORT" -o StrictHostKeyChecking=no /tmp/135erheli-site.tar.gz "$SSH_USERNAME@$SSH_HOST:/tmp/135erheli-site.tar.gz"

          REMOTE='set -euo pipefail
          TARGET="/var/www/vhosts/135erheli.de/httpdocs"
          test -d "$TARGET"
          rm -rf /tmp/135erheli-stage
          mkdir -p /tmp/135erheli-stage
          tar -xzf /tmp/135erheli-site.tar.gz -C /tmp/135erheli-stage
          install -m 0644 /tmp/135erheli-stage/index.html "$TARGET/index.html"
          install -m 0644 /tmp/135erheli-stage/styles.css "$TARGET/styles.css"
          install -m 0644 /tmp/135erheli-stage/app.js "$TARGET/app.js"
          chown --reference="$TARGET" "$TARGET/index.html" "$TARGET/styles.css" "$TARGET/app.js"
          rm -rf /tmp/135erheli-stage /tmp/135erheli-site.tar.gz'

          B64="$(printf '%s' "$REMOTE" | base64 -w0)"
          if sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USERNAME@$SSH_HOST" 'id -u' | grep -qx 0; then
            sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USERNAME@$SSH_HOST" "echo '$B64' | base64 -d | bash"
          else
            printf '%s\n' "$SSH_PASSWORD" | sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USERNAME@$SSH_HOST" "sudo -S -p '' bash -c \"echo '$B64' | base64 -d | bash\""
          fi

      - name: Verify live website
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if curl -LfsS https://135erheli.de/ -o /tmp/135erheli.html && grep -q 'JL1976' /tmp/135erheli.html; then
              echo '135erHeli.de is live.'
              exit 0
            fi
            sleep 5
          done
          echo 'Live verification failed.' >&2
          exit 1
