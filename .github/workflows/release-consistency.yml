name: Validate GrowCentral Release Consistency

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'RELEASE_STATE.md'
      - 'README.md'
      - 'docs/**'
      - 'wiki/**'
      - 'website/**'
      - 'mobile/**'
      - 'shared/hardware_profile.py'
      - '.github/workflows/release-consistency.yml'

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify canonical release markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'alpha-0.7.5' RELEASE_STATE.md
          grep -Fq 'Build 176' RELEASE_STATE.md
          grep -Fq 'pi-universal-alpha-0.7.5-176' RELEASE_STATE.md
          grep -Fq 'CANDIDATE' RELEASE_STATE.md
          grep -Fq 'neuer Universal-Image-Build erforderlich' RELEASE_STATE.md

      - name: Verify canonical hardware support classes
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/HARDWARE_SUPPORT_POLICY.md
          grep -Fq 'LEGACY_LITE' docs/HARDWARE_SUPPORT_POLICY.md
          grep -Fq 'FULL_SUPPORT' docs/HARDWARE_SUPPORT_POLICY.md
          grep -Fq 'Universal-Image' docs/HARDWARE_SUPPORT_POLICY.md
          grep -Fq 'LEGACY_LITE' shared/hardware_profile.py
          grep -Fq 'FULL_STANDARD' shared/hardware_profile.py
          grep -Fq 'FULL_PERFORMANCE' shared/hardware_profile.py

      - name: Verify active entry points use universal hardware strategy
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md docs/PROJECT_STATUS.md docs/RELEASE_PIPELINE.md docs/README.md website/README.md; do
            grep -Eiq 'Universal[- ]Image|universal image' "$file" || { echo "missing universal-image strategy in $file"; exit 1; }
          done
          grep -Fq 'Legacy/Lite' website/index.html
          grep -Fq 'Full Support' website/index.html
          grep -Fq 'Build 176' website/index.html
          grep -Fxq '0.2.1' mobile/VERSION
          grep -Fq '"version": "0.2.1"' mobile/package.json

      - name: Guard validation state
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '**Status: VALIDATED**' RELEASE_STATE.md || grep -Fq 'Published candidate status: `VALIDATED`' RELEASE_STATE.md; then
            echo 'The published candidate must not be marked VALIDATED without real class-specific hardware validation.'
            exit 1
          fi

      - name: Guard obsolete active release anchors
        shell: bash
        run: |
          set -euo pipefail
          for file in RELEASE_STATE.md README.md docs/PROJECT_STATUS.md docs/RELEASE_PIPELINE.md docs/README.md website/README.md; do
            if grep -Eq 'Build 118|pi-universal-alpha-0\.7\.5-118|master e339602' "$file"; then
              echo "obsolete active release marker found in $file"
              exit 1
            fi
          done

      - name: Verify Nexus design binding
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/DESIGN_SYSTEM_NEXUS.md
          grep -Fq 'GrowCentral Nexus UI' BRANDING.md
          grep -Fq 'GrowCentral Nexus UI' docs/DESIGN_SYSTEM_NEXUS.md
