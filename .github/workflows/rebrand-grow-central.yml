name: Rebrand project to 135er-Grow Central

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/rebrand-grow-central.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repository-wide migration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')
          workflow_dir = root / '.github' / 'workflows'
          ow = 'Grow' + 'Control'
          ol = 'grow' + 'control'
          ou = 'GROW' + 'CONTROL'
          orp = '135er_' + ow
          op = '135er ' + ow
          oh = '135er-' + ow
          oslug = '135er-' + ol
          ouslug = '135er_' + ol

          repl = [
              ('jygnw29kms-bit/' + orp, 'jygnw29kms-bit/135er-Grow-Central'),
              (op, '135er-Grow Central'),
              (oh, '135er-Grow Central'),
              (orp, '135er-Grow-Central'),
              (oslug, '135er-grow-central'),
              (ouslug, '135er_grow_central'),
              ('135ER / ' + ou, '135ER-GROW CENTRAL'),
              ('135ER ' + ou, '135ER-GROW CENTRAL'),
              (ow, 'Grow Central'),
              (ou, 'GROW CENTRAL'),
              (ol, 'grow-central'),
              ('Grow' + ' Control', 'Grow Central'),
              ('grow' + ' control', 'grow central'),
          ]

          def is_workflow(path):
              try:
                  path.relative_to(workflow_dir)
                  return True
              except ValueError:
                  return False

          shutil.rmtree(root / '.vs', ignore_errors=True)

          for p in list(root.rglob('*')):
              if not p.is_file() or '.git' in p.parts or is_workflow(p):
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, newv in repl:
                  new = new.replace(old, newv)
              if new != text:
                  p.write_text(new, encoding='utf-8')

          for p in sorted([x for x in root.rglob('*') if '.git' not in x.parts and not is_workflow(x)], key=lambda x: len(x.parts), reverse=True):
              name = p.name
              new = name
              for old, newv in [
                  (orp, '135er-Grow-Central'),
                  (oslug, '135er-grow-central'),
                  (ouslug, '135er_grow_central'),
                  (ow, 'Grow-Central'),
                  (ol, 'grow-central'),
                  (ou, 'GROW-CENTRAL'),
              ]:
                  new = new.replace(old, newv)
              if new != name and p.exists():
                  target = p.with_name(new)
                  if target.exists():
                      if p.is_dir():
                          shutil.copytree(p, target, dirs_exist_ok=True); shutil.rmtree(p)
                      else:
                          target.write_bytes(p.read_bytes()); p.unlink()
                  else:
                      p.rename(target)

          obsolete = [
              'web/brand-logo.png',
              'cloud/web/brand-logo.png',
              'docs/assets/brand/135er-grow-central-logo.png',
              'docs/assets/gui/gui-preview-v0.5.png',
              'website/assets/brand/135er-grow-central-repo-mark.png',
              'website/assets/brand/favicon.ico',
              'website/assets/gui-preview-v0.5.png',
              'website/assets/gui-power-preview-v0.7.svg',
              'website/assets/gui/local-desktop-v0.7.png',
              'website/assets/gui/local-tablet-v0.7.png',
              'website/assets/gui/local-mobile-v0.7.png',
              'website/assets/gui/cloud-desktop-v0.7.png',
          ]
          for item in obsolete:
              p = root / item
              if p.exists() and p.is_file():
                  p.unlink()

          pairs = [
              ('website/assets/brand/135er-grow-central-logo.svg', 'web/brand-logo.svg'),
              ('website/assets/brand/135er-grow-central-mark.svg', 'web/brand-mark.svg'),
              ('website/assets/brand/135er-grow-central-logo.svg', 'cloud/web/brand-logo.svg'),
              ('website/assets/brand/135er-grow-central-mark.svg', 'cloud/web/brand-mark.svg'),
              ('website/assets/brand/135er-grow-central-logo.svg', 'docs/assets/brand/135er-grow-central-logo.svg'),
              ('website/assets/brand/135er-grow-central-mark.svg', 'docs/assets/brand/135er-grow-central-mark.svg'),
          ]
          for src, dst in pairs:
              s, d = root/src, root/dst
              d.parent.mkdir(parents=True, exist_ok=True)
              d.write_text(s.read_text(encoding='utf-8'), encoding='utf-8')

          for name in ('local-desktop-v0.8.svg','local-tablet-v0.8.svg','local-mobile-v0.8.svg','cloud-desktop-v0.8.svg'):
              s = root/'website/assets/gui'/name
              d = root/'docs/assets/gui'/name
              d.parent.mkdir(parents=True, exist_ok=True)
              d.write_text(s.read_text(encoding='utf-8'), encoding='utf-8')

          refs = [
              ('assets/brand/135er-grow-central-logo.png','assets/brand/135er-grow-central-logo.svg'),
              ('assets/brand/135er-grow-central-mark.png','assets/brand/135er-grow-central-mark.svg'),
              ('assets/brand/135er-grow-central-repo-mark.png','assets/brand/135er-grow-central-logo.svg'),
              ('/static/brand-logo.png','/static/brand-logo.svg'),
              ('docs/assets/brand/135er-grow-central-logo.png','docs/assets/brand/135er-grow-central-logo.svg'),
              ('docs/assets/gui/gui-preview-v0.5.png','docs/assets/gui/local-desktop-v0.8.svg'),
              ('assets/gui/local-desktop-v0.7.png','assets/gui/local-desktop-v0.8.svg'),
              ('assets/gui/local-tablet-v0.7.png','assets/gui/local-tablet-v0.8.svg'),
              ('assets/gui/local-mobile-v0.7.png','assets/gui/local-mobile-v0.8.svg'),
              ('assets/gui/cloud-desktop-v0.7.png','assets/gui/cloud-desktop-v0.8.svg'),
              ('assets/brand/favicon.ico','assets/brand/135er-grow-central-mark.svg'),
          ]
          for p in list(root.rglob('*')):
              if not p.is_file() or '.git' in p.parts or is_workflow(p):
                  continue
              try: text=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              new=text
              for old,newv in refs: new=new.replace(old,newv)
              if p == root/'web/index.html' and 'brand-mark-corner' not in new:
                  new=new.replace('</aside>', '<img class="brand-mark-corner" src="/static/brand-mark.svg" alt="J. L. 1976 Markenzeichen"></aside>')
              if p == root/'cloud/web/index.html' and 'brand-mark.svg' not in new:
                  new=new.replace('<div class="g">● VPS ONLINE</div>', '<div class="g">● VPS ONLINE <img src="/static/brand-mark.svg" alt="J. L. 1976 Markenzeichen" style="width:36px;height:36px;vertical-align:middle;margin-left:10px"></div>')
              if new != text: p.write_text(new,encoding='utf-8')

          (root/'README.md').write_text('''# 135er-Grow Central\n\n<p align="center"><img src="website/assets/brand/135er-grow-central-logo.svg" alt="135er-Grow Central Logo" width="720"></p>\n<p align="center"><strong>LOCAL-FIRST · RASPBERRY PI · SMART HOME · POWER TELEMETRY</strong></p>\n<p align="center"><code>🚧 WORK IN PROGRESS</code> &nbsp; <code>v0.8 development</code> &nbsp; <code>deny-by-default writes</code></p>\n\n> [!WARNING]\n> **Work in Progress:** Hardware- und Protokollpfade werden weiter validiert. Der Raspberry Pi bleibt die lokale Autorität; optionale Cloud-Funktionen ersetzen die lokale Steuerung nicht.\n\n## Vier GUI-Clients · ein Design\n\n![Local Desktop](website/assets/gui/local-desktop-v0.8.svg)\n![Local Tablet](website/assets/gui/local-tablet-v0.8.svg)\n![Local Mobile](website/assets/gui/local-mobile-v0.8.svg)\n![Cloud Desktop](website/assets/gui/cloud-desktop-v0.8.svg)\n\n## Architektur\n\n```text\nGeräte / Sensoren / Smart Plugs\n            |\n            v\n   135er-Grow Central Local\n        Raspberry Pi\n       /     |      \\\n  BLE DF100M |       Shelly RPC\n             |\n           SQLite\n             | outbound HTTPS\n             v\n       optional cloud\n```\n\n## Branding\n- Logo: `website/assets/brand/135er-grow-central-logo.svg`\n- Markenzeichen: `website/assets/brand/135er-grow-central-mark.svg`\n- Logo dominant; Markenzeichen klein und dauerhaft sichtbar.\n- Kein WebP.\n\n## Raspberry Pi\nBootlogo und ASCII-Konsolenbegrüßung werden im Image-Build eingebunden.\n''', encoding='utf-8')

          (root/'BRANDING.md').write_text('''# 135er-Grow Central Branding\n\n**Offizielle Schreibweise:** 135er-Grow Central\n\nTechnisch: `135er-grow-central` · intern: `135er_grow_central` · UI: `135ER-GROW CENTRAL`.\n\nWebsite, Repository, Local GUI, Cloud GUI und Raspberry-Pi-Image verwenden dieselbe Near-Black-, Electric-Green- und Cyan-Designsprache. Das Logo ist dominant; `J. L. 1976` bleibt als kleines Markenzeichen sichtbar.\n''', encoding='utf-8')
          PY

      - name: Verify project files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          rx=re.compile('grow'+r'[ _-]*'+'control',re.I)
          bad=[]
          for p in Path('.').rglob('*'):
              if '.git' in p.parts or ('.github' in p.parts and 'workflows' in p.parts): continue
              if rx.search(str(p)): bad.append('PATH '+str(p))
              if p.is_file():
                  try: t=p.read_text(encoding='utf-8')
                  except UnicodeDecodeError: continue
                  if rx.search(t): bad.append('TEXT '+str(p))
          print('\n'.join(bad) if bad else 'Project files clean.')
          sys.exit(1 if bad else 0)
          PY

      - name: Commit project migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git diff --cached --quiet && exit 0
          git commit -m "Rebrand project as 135er-Grow Central"
          git push origin master
