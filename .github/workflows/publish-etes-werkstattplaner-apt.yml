name: Publish Etes Werkstattplaner APT
'on':
  push:
    branches:
    - master
    paths:
    - deploy/verified-releases/**
    - .github/workflows/publish-etes-werkstattplaner-apt.yml
  workflow_dispatch: ''
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Verify published release package and generate APT metadata
      shell: bash
      run: "set -euo pipefail\nsudo apt-get update -qq\nsudo apt-get install -y -qq\
        \ dpkg-dev\nmkdir -p publish\npython3 - <<'VERIFY'\nimport json,base64,hashlib,re,subprocess\n\
        from pathlib import Path\nmanifest=json.loads(Path('deploy/verified-releases/current.json').read_text())\n\
        name=manifest['filename']\nassert re.fullmatch(r'etes-werkstattplaner_[0-9]+\\\
        .[0-9]+\\.[0-9]+-1_all\\.deb',name)\nraw=base64.b64decode(Path('deploy/verified-releases',name+'.b64').read_bytes(),validate=False)\n\
        assert hashlib.sha256(raw).hexdigest()==manifest['sha256']\npackage=Path('publish',name);package.write_bytes(raw)\n\
        assert subprocess.check_output(['dpkg-deb','-f',str(package),'Package'],text=True).strip()=='etes-werkstattplaner'\n\
        assert subprocess.check_output(['dpkg-deb','-f',str(package),'Version'],text=True).strip()==manifest['version']+'-1'\n\
        Path('publish/current-deb-name.txt').write_text(name)\nprint('Verified APT\
        \ package:',manifest['version'])\nVERIFY\nbase64 -d external/etes-werkstattplaner/releases/etes-werkstattplaner_1.0.0-1_all.deb.b64\
        \ > publish/etes-werkstattplaner_1.0.0-1_all.deb\n(cd publish && dpkg-scanpackages\
        \ . /dev/null > Packages && gzip -9 -k -f Packages)\ncat > publish/.htaccess\
        \ <<'CONFIG'\nOptions -Indexes\n<IfModule mod_authz_core.c>\n  <FilesMatch\
        \ \"^(Packages|Packages\\.gz|etes-werkstattplaner_.*\\.deb)$\">\n    Require\
        \ all granted\n  </FilesMatch>\n</IfModule>\n<IfModule mod_mime.c>\n  AddType\
        \ application/gzip .gz\n  AddType application/vnd.debian.binary-package .deb\n\
        </IfModule>\nCONFIG\n"
    - name: Deploy through existing Grow Central SFTP secrets
      env:
        SFTP_HOST: ${{ secrets.SFTP_HOST }}
        SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        SFTP_PORT: ${{ secrets.SFTP_PORT }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      shell: bash
      run: 'set -euo pipefail

        install -d -m 700 ~/.ssh

        printf ''%s\n'' "$SSH_PRIVATE_KEY" > ~/.ssh/etes_deploy

        chmod 600 ~/.ssh/etes_deploy

        ssh-keyscan -p "$SFTP_PORT" "$SFTP_HOST" >> ~/.ssh/known_hosts

        chmod 600 ~/.ssh/known_hosts


        DEB_NAME="$(cat publish/current-deb-name.txt)"

        cat > /tmp/sftp-batch <<EOF

        cd /var/www/vhosts/grow-central.de/httpdocs

        -mkdir downloads

        -mkdir downloads/apt

        -mkdir downloads/apt/werkstattplaner

        put publish/.htaccess downloads/apt/werkstattplaner/.htaccess

        put publish/etes-werkstattplaner_1.0.0-1_all.deb downloads/apt/werkstattplaner/etes-werkstattplaner_1.0.0-1_all.deb

        put publish/${DEB_NAME} downloads/apt/werkstattplaner/${DEB_NAME}

        put publish/Packages downloads/apt/werkstattplaner/Packages.new

        put publish/Packages.gz downloads/apt/werkstattplaner/Packages.gz.new

        rename downloads/apt/werkstattplaner/Packages.new downloads/apt/werkstattplaner/Packages

        rename downloads/apt/werkstattplaner/Packages.gz.new downloads/apt/werkstattplaner/Packages.gz

        bye

        EOF

        sftp -i ~/.ssh/etes_deploy -P "$SFTP_PORT" -o BatchMode=yes -b /tmp/sftp-batch
        "$SFTP_USERNAME@$SFTP_HOST"

        rm -f ~/.ssh/etes_deploy /tmp/sftp-batch

        '
    - name: Normalize public APT permissions
      env:
        SSH_HOST: ${{ secrets.SSH_HOST || secrets.SFTP_HOST }}
        SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        SSH_PORT: ${{ secrets.SSH_PORT || secrets.SFTP_PORT }}
        SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      shell: bash
      run: "set -euo pipefail\nsudo apt-get update -qq\nsudo apt-get install -y -qq\
        \ sshpass\n: \"${SSH_PORT:=22}\"\nexport SSHPASS=\"$SSH_PASSWORD\"\ninstall\
        \ -d -m 700 ~/.ssh\nssh-keyscan -p \"$SSH_PORT\" \"$SSH_HOST\" >> ~/.ssh/known_hosts\n\
        chmod 600 ~/.ssh/known_hosts\nREMOTE='chmod 755 /var/www/vhosts/grow-central.de/httpdocs/downloads\
        \ /var/www/vhosts/grow-central.de/httpdocs/downloads/apt /var/www/vhosts/grow-central.de/httpdocs/downloads/apt/werkstattplaner\n\
        chmod 644 /var/www/vhosts/grow-central.de/httpdocs/downloads/apt/werkstattplaner/Packages\
        \ /var/www/vhosts/grow-central.de/httpdocs/downloads/apt/werkstattplaner/Packages.gz\
        \ /var/www/vhosts/grow-central.de/httpdocs/downloads/apt/werkstattplaner/*.deb\
        \ /var/www/vhosts/grow-central.de/httpdocs/downloads/apt/werkstattplaner/.htaccess'\n\
        B64=\"$(printf '%s' \"$REMOTE\" | base64 -w0)\"\nif sshpass -e ssh -p \"$SSH_PORT\"\
        \ -o BatchMode=no \"$SSH_USERNAME@$SSH_HOST\" 'id -u' | grep -qx 0; then\n\
        \  sshpass -e ssh -p \"$SSH_PORT\" -o BatchMode=no \"$SSH_USERNAME@$SSH_HOST\"\
        \ \"echo '$B64' | base64 -d | bash\"\nelse\n  printf '%s\\n' \"$SSH_PASSWORD\"\
        \ | sshpass -e ssh -p \"$SSH_PORT\" -o BatchMode=no \"$SSH_USERNAME@$SSH_HOST\"\
        \ \"sudo -S -p '' bash -c \\\"echo '$B64' | base64 -d | bash\\\"\"\nfi\n"
