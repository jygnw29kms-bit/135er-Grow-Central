name: Publish Etes Werkstattplaner APT

on:
  push:
    branches: [ master ]
    paths:
      - 'external/etes-werkstattplaner/**'
      - '.github/workflows/publish-etes-werkstattplaner-apt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build flat APT repository
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          mkdir -p publish
          base64 -d external/etes-werkstattplaner/releases/etes-werkstattplaner_1.0.0-1_all.deb.b64 > publish/etes-werkstattplaner_1.0.0-1_all.deb
          dpkg-deb --info publish/etes-werkstattplaner_1.0.0-1_all.deb
          (cd publish && dpkg-scanpackages . /dev/null > Packages && gzip -9 -k -f Packages)
          cat > publish/.htaccess <<'EOF'
          Options -Indexes
          <IfModule mod_authz_core.c>
            <FilesMatch "^(Packages|Packages\\.gz|etes-werkstattplaner_.*\\.deb)$">
              Require all granted
            </FilesMatch>
          </IfModule>
          <IfModule mod_mime.c>
            AddType text/plain .gz
            AddType application/vnd.debian.binary-package .deb
          </IfModule>
          EOF

      - name: Deploy through existing Grow Central SFTP secrets
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/etes_deploy
          chmod 600 ~/.ssh/etes_deploy
          ssh-keyscan -p "$SFTP_PORT" "$SFTP_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > /tmp/sftp-batch <<'EOF'
          cd /var/www/vhosts/grow-central.de/httpdocs
          -mkdir downloads
          -mkdir downloads/apt
          -mkdir downloads/apt/werkstattplaner
          put publish/.htaccess downloads/apt/werkstattplaner/.htaccess
          put publish/Packages downloads/apt/werkstattplaner/Packages
          put publish/Packages.gz downloads/apt/werkstattplaner/Packages.gz
          put publish/etes-werkstattplaner_1.0.0-1_all.deb downloads/apt/werkstattplaner/etes-werkstattplaner_1.0.0-1_all.deb
          bye
          EOF
          sftp -i ~/.ssh/etes_deploy -P "$SFTP_PORT" -o BatchMode=yes -b /tmp/sftp-batch "$SFTP_USERNAME@$SFTP_HOST"
          rm -f ~/.ssh/etes_deploy /tmp/sftp-batch
