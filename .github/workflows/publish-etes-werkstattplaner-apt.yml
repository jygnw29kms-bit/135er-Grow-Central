name: Publish Etes Werkstattplaner APT

on:
  push:
    branches: [ master ]
    paths:
      - 'external/etes-werkstattplaner/**'
      - '.github/workflows/publish-etes-werkstattplaner-apt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and test Werkstattplaner 1.2.0
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev
          python3 -m py_compile external/etes-werkstattplaner/source/app/server.py

          rm -rf pkg publish /tmp/etes-test-data
          mkdir -p             pkg/DEBIAN             pkg/opt/etes-werkstattplaner             pkg/lib/systemd/system             pkg/usr/sbin             pkg/etc/default             publish

          cp -a external/etes-werkstattplaner/source/app/. pkg/opt/etes-werkstattplaner/
          for f in control postinst prerm postrm conffiles; do
            cp "external/etes-werkstattplaner/source/packaging/$f" "pkg/DEBIAN/$f"
          done
          cp external/etes-werkstattplaner/source/packaging/etes-werkstattplaner.service pkg/lib/systemd/system/
          cp external/etes-werkstattplaner/source/packaging/etes-werkstattplaner-user pkg/usr/sbin/
          cp external/etes-werkstattplaner/source/packaging/default pkg/etc/default/etes-werkstattplaner

          chmod 0755 pkg/DEBIAN/postinst pkg/DEBIAN/prerm pkg/DEBIAN/postrm
          chmod 0755 pkg/opt/etes-werkstattplaner/server.py pkg/usr/sbin/etes-werkstattplaner-user

          test -s pkg/opt/etes-werkstattplaner/public/etes-werkstattplaner-logo.svg

          dpkg-deb --build --root-owner-group pkg publish/etes-werkstattplaner_1.2.0-4_all.deb
          dpkg-deb --info publish/etes-werkstattplaner_1.2.0-4_all.deb

          # Alte Version im Repo behalten, damit ein Rollback möglich bleibt.
          base64 -d external/etes-werkstattplaner/releases/etes-werkstattplaner_1.0.0-1_all.deb.b64             > publish/etes-werkstattplaner_1.0.0-1_all.deb

          # Frische Installation testen: ohne Benutzer muss Setup erzwungen werden.
          mkdir -p /tmp/etes-test-data
          DATA_DIR=/tmp/etes-test-data HOST=127.0.0.1 PORT=38080 COOKIE_SECURE=0             python3 external/etes-werkstattplaner/source/app/server.py >/tmp/etes-test.log 2>&1 &
          TEST_PID=$!
          trap 'kill $TEST_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:38080/api/setup-status >/tmp/setup.json; then break; fi
            sleep .2
          done
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/setup.json'))
          assert d == {'needs_setup': True}, d
          PY
          curl -fsS -X POST -H 'Content-Type: application/json'             -d '{"name":"TestAdmin","password":"TestPasswort123!","password_confirm":"TestPasswort123!"}'             http://127.0.0.1:38080/api/setup >/tmp/setup-create.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/setup-create.json'))
          assert d['user']['role']=='admin'
          assert d['user']['name']=='TestAdmin'
          PY
          kill $TEST_PID
          trap - EXIT

          (cd publish && dpkg-scanpackages . /dev/null > Packages && gzip -9 -k -f Packages)
          cat > publish/.htaccess <<'EOF'
          Options -Indexes
          <IfModule mod_authz_core.c>
            <FilesMatch "^(Packages|Packages\.gz|etes-werkstattplaner_.*\.deb)$">
              Require all granted
            </FilesMatch>
          </IfModule>
          <IfModule mod_mime.c>
            AddType application/gzip .gz
            AddType application/vnd.debian.binary-package .deb
          </IfModule>
          EOF

      - name: Deploy through existing Grow Central SFTP secrets
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/etes_deploy
          chmod 600 ~/.ssh/etes_deploy
          ssh-keyscan -p "$SFTP_PORT" "$SFTP_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > /tmp/sftp-batch <<'EOF'
          cd /var/www/vhosts/grow-central.de/httpdocs
          -mkdir downloads
          -mkdir downloads/apt
          -mkdir downloads/apt/werkstattplaner
          put publish/.htaccess downloads/apt/werkstattplaner/.htaccess
          put publish/Packages downloads/apt/werkstattplaner/Packages
          put publish/Packages.gz downloads/apt/werkstattplaner/Packages.gz
          put publish/etes-werkstattplaner_1.0.0-1_all.deb downloads/apt/werkstattplaner/etes-werkstattplaner_1.0.0-1_all.deb
          put publish/etes-werkstattplaner_1.2.0-4_all.deb downloads/apt/werkstattplaner/etes-werkstattplaner_1.2.0-4_all.deb
          bye
          EOF
          sftp -i ~/.ssh/etes_deploy -P "$SFTP_PORT" -o BatchMode=yes -b /tmp/sftp-batch "$SFTP_USERNAME@$SFTP_HOST"
          rm -f ~/.ssh/etes_deploy /tmp/sftp-batch


      - name: Normalize public APT permissions
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.SFTP_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || secrets.SFTP_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          : "${SSH_PORT:=22}"
          export SSHPASS="$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          REMOTE='chmod 755 /var/www/vhosts/grow-central.de/httpdocs/downloads /var/www/vhosts/grow-central.de/httpdocs/downloads/apt /var/www/vhosts/grow-central.de/httpdocs/downloads/apt/werkstattplaner
          chmod 644 /var/www/vhosts/grow-central.de/httpdocs/downloads/apt/werkstattplaner/Packages /var/www/vhosts/grow-central.de/httpdocs/downloads/apt/werkstattplaner/Packages.gz /var/www/vhosts/grow-central.de/httpdocs/downloads/apt/werkstattplaner/*.deb /var/www/vhosts/grow-central.de/httpdocs/downloads/apt/werkstattplaner/.htaccess'
          B64="$(printf '%s' "$REMOTE" | base64 -w0)"
          if sshpass -e ssh -p "$SSH_PORT" -o BatchMode=no "$SSH_USERNAME@$SSH_HOST" 'id -u' | grep -qx 0; then
            sshpass -e ssh -p "$SSH_PORT" -o BatchMode=no "$SSH_USERNAME@$SSH_HOST" "echo '$B64' | base64 -d | bash"
          else
            printf '%s\n' "$SSH_PASSWORD" | sshpass -e ssh -p "$SSH_PORT" -o BatchMode=no "$SSH_USERNAME@$SSH_HOST" "sudo -S -p '' bash -c \"echo '$B64' | base64 -d | bash\""
          fi
