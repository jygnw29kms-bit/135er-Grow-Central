name: Build 135er-Grow Central Universal Raspberry Pi Image

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/build-pi3-image.yml'
      - 'app/**'
      - 'shared/**'
      - 'web/**'
      - 'requirements.txt'
      - 'image-builder/brand/**'
      - 'image-builder/firstboot/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 110
    env:
      BASE_URL: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2026-06-19/2026-06-18-raspios-trixie-arm64-lite.img.xz
      BASE_SHA256: acff736ca7945e3b305f07cda4abdb870910e12634991da69783611756e381b3
      IMAGE_NAME: 135er_Grow_Central_RPi3Plus_Universal
    steps:
      - name: Checkout 135er-Grow Central
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install image build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils rsync dosfstools e2fsprogs util-linux cloud-guest-utils systemd-container

      - name: Download and verify Raspberry Pi OS Lite 64-bit
        run: |
          curl -L --fail --retry 5 --retry-delay 3 -o base.img.xz "$BASE_URL"
          echo "$BASE_SHA256  base.img.xz" | sha256sum -c -
          xz -dk base.img.xz
          mv base.img work.img
          truncate -s +2G work.img

      - name: Customize image
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=/mnt/grow-central-root
          sudo mkdir -p "$ROOT"
          LOOP=$(sudo losetup --find --show --partscan work.img)
          cleanup() {
            set +e
            sudo umount "$ROOT/dev/pts" 2>/dev/null
            sudo umount "$ROOT/dev" 2>/dev/null
            sudo umount "$ROOT/proc" 2>/dev/null
            sudo umount "$ROOT/sys" 2>/dev/null
            sudo umount "$ROOT/boot/firmware" 2>/dev/null
            sudo umount "$ROOT" 2>/dev/null
            sudo losetup -d "$LOOP" 2>/dev/null
          }
          trap cleanup EXIT

          sudo growpart "$LOOP" 2
          sudo e2fsck -fy "${LOOP}p2"
          sudo resize2fs "${LOOP}p2"

          sudo mount "${LOOP}p2" "$ROOT"
          sudo mkdir -p "$ROOT/boot/firmware"
          sudo mount "${LOOP}p1" "$ROOT/boot/firmware"

          sudo mkdir -p "$ROOT/opt/135er-grow-central"
          sudo rsync -a --delete \
            --exclude='.git' --exclude='.github' \
            --exclude='base.img*' --exclude='work.img*' \
            --exclude='*.img' --exclude='*.img.xz' \
            ./ "$ROOT/opt/135er-grow-central/"
          printf '%s\n' "$GITHUB_RUN_NUMBER" | sudo tee "$ROOT/opt/135er-grow-central/BUILD" >/dev/null

          sudo mount --bind /dev "$ROOT/dev"
          sudo mount --bind /dev/pts "$ROOT/dev/pts"
          sudo mount -t proc proc "$ROOT/proc"
          sudo mount -t sysfs sys "$ROOT/sys"
          sudo cp /etc/resolv.conf "$ROOT/etc/resolv.conf"

          sudo chroot "$ROOT" /bin/bash -eux <<'CHROOT'
          export DEBIAN_FRONTEND=noninteractive
          echo '135er-grow-central' > /etc/hostname
          sed -i 's/^127\.0\.1\.1.*/127.0.1.1\t135er-grow-central/' /etc/hosts || true

          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3 python3-pip python3-venv python3-pam bluetooth bluez sqlite3 jq rsync logrotate openssh-server sudo unattended-upgrades apt-listchanges ufw openssl network-manager polkitd dnsmasq-base iw wireless-regdb rfkill avahi-daemon avahi-utils libnss-mdns ffmpeg v4l-utils wtmpdb psmisc plymouth plymouth-themes locales keyboard-configuration console-setup tzdata

          # Netplan rejects world-readable YAML because it can contain network
          # secrets. Raspberry Pi OS ships this NetworkManager file too openly.
          find /etc/netplan /usr/lib/netplan -type f -name '*.yaml' -exec chmod 0600 {} + 2>/dev/null || true

          if ! id GrowCentral >/dev/null 2>&1; then
            FIRST_USER="$(getent passwd 1000 | cut -d: -f1)"
            test -n "$FIRST_USER"
            usermod --login GrowCentral --home /home/GrowCentral --move-home "$FIRST_USER"
            FIRST_GROUP="$(getent group 1000 | cut -d: -f1)"
            if [ -n "$FIRST_GROUP" ]; then groupmod --new-name GrowCentral "$FIRST_GROUP"; fi
          fi
          echo 'GrowCentral:grow-central-test' | chpasswd
          usermod --shell /bin/bash GrowCentral
          chage --lastday "$(date +%Y-%m-%d)" --expiredate -1 --inactive -1 --mindays 0 --maxdays 99999 GrowCentral
          usermod -aG sudo GrowCentral
          for g in bluetooth dialout video gpio i2c spi netdev; do getent group "$g" >/dev/null && usermod -aG "$g" GrowCentral || true; done
          rm -f /etc/sudoers.d/010-grow-central-test

          rm -f /etc/ssh/sshd_config.d/rename_user.conf /etc/xdg/autostart/piwiz.desktop
          rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf
          rm -f /etc/systemd/system/serial-getty@ttyAMA0.service.d/autologin.conf
          systemctl disable userconfig.service || true
          systemctl mask userconfig.service
          systemctl enable getty@tty1.service

          sed -i 's/^# *de_DE.UTF-8 UTF-8/de_DE.UTF-8 UTF-8/' /etc/locale.gen
          locale-gen de_DE.UTF-8
          update-locale LANG=de_DE.UTF-8 LANGUAGE=de_DE:de
          ln -snf /usr/share/zoneinfo/Europe/Berlin /etc/localtime
          echo 'Europe/Berlin' >/etc/timezone
          dpkg-reconfigure -f noninteractive tzdata
          cat >/etc/default/keyboard <<'EOF'
          XKBMODEL="pc105"
          XKBLAYOUT="de"
          XKBVARIANT="nodeadkeys"
          XKBOPTIONS=""
          BACKSPACE="guess"
          EOF
          dpkg-reconfigure -f noninteractive keyboard-configuration

          if ! id growcentral >/dev/null 2>&1; then useradd --system --home /var/lib/135er-grow-central --create-home --shell /usr/sbin/nologin growcentral; fi
          for g in bluetooth video netdev; do getent group "$g" >/dev/null && usermod -aG "$g" growcentral || true; done
          usermod -aG growcentral GrowCentral
          install -d -o growcentral -g growcentral -m 0750 /var/lib/135er-grow-central
          install -d -o root -g growcentral -m 0750 /etc/135er-grow-central
          install -d -o root -g growcentral -m 0750 /var/lib/135er-grow-central/support
          install -d -o root -g systemd-journal -m 2755 /var/log/journal
          mkdir -p /etc/polkit-1/rules.d
          cat >/etc/polkit-1/rules.d/60-grow-central-network.rules <<'EOF'
          polkit.addRule(function(action, subject) {
            var allowed = [
              'org.freedesktop.NetworkManager.network-control',
              'org.freedesktop.NetworkManager.settings.modify.system',
              'org.freedesktop.NetworkManager.settings.modify.own'
            ];
            if (subject.user == 'growcentral' && allowed.indexOf(action.id) >= 0) {
              return polkit.Result.YES;
            }
          });
          EOF
          chmod 0644 /etc/polkit-1/rules.d/60-grow-central-network.rules
          mkdir -p /etc/systemd/journald.conf.d
          cat >/etc/systemd/journald.conf.d/20-grow-central-persistent.conf <<'EOF'
          [Journal]
          Storage=persistent
          Compress=yes
          Seal=yes
          SystemMaxUse=150M
          MaxRetentionSec=14day
          EOF

          cd /opt/135er-grow-central
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip wheel
          .venv/bin/pip install -r requirements.txt

          cat >.env <<'EOF'
          DF100M_NAME_HINT=MZ_MZF002
          DF100M_WRITE_UUID=f5d2b3fe-e6b5-49b5-aa5f-a00bb4156d1d
          DF100M_NOTIFY_UUID=83677baa-3eb8-4866-b6b6-96e5ed5cc48d
          DF100M_SPEED_MODE=byte
          DF100M_ALLOW_WRITES=false
          GC_TEST_USERNAME=test
          GC_TEST_PASSWORD=test
          GC_API_TOKEN=test
          GC_LOCAL_API_TOKEN=test
          GC_CLOUD_TOKEN=test
          GC_REMOTE_COMMANDS=false
          GC_CLOUD_ENABLED=false
          GC_SMARTHOME_ENABLED=true
          GC_CAMERA_ENABLED=true
          GC_CAMERA_DEVICE=
          EOF
          GUI_PASSWORD_HASH="$(.venv/bin/python -c "from app.gui_auth import hash_password; print(hash_password('grow-central-test'))")"
          printf 'GC_GUI_USERNAME=GrowCentral\nGC_GUI_PASSWORD_HASH=%s\n' "$GUI_PASSWORD_HASH" >>.env
          chown -R root:growcentral /opt/135er-grow-central
          chmod -R g+rX /opt/135er-grow-central
          chmod 0640 /opt/135er-grow-central/.env
          mkdir -p /opt/135er-grow-central/data
          chown growcentral:growcentral /opt/135er-grow-central/data

          cat >/etc/systemd/system/135er-grow-central.service <<'EOF'
          [Unit]
          Description=135er-Grow Central Local
          After=network-online.target bluetooth.target grow-central-firstboot-firewall.service grow-central-setup-ap.service
          Wants=network-online.target bluetooth.target grow-central-setup-ap.service
          OnFailure=grow-central-support-on-failure@%n.service
          [Service]
          Type=simple
          User=growcentral
          Group=growcentral
          WorkingDirectory=/opt/135er-grow-central
          EnvironmentFile=/opt/135er-grow-central/.env
          ExecStart=/opt/135er-grow-central/.venv/bin/uvicorn app.entrypoint:app --host 0.0.0.0 --port 8080
          Restart=always
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true
          SupplementaryGroups=systemd-journal video netdev
          ProtectSystem=strict
          ProtectHome=true
          ReadWritePaths=/opt/135er-grow-central/data /var/lib/135er-grow-central
          [Install]
          WantedBy=multi-user.target
          EOF

          install -o root -g root -m 0644 /opt/135er-grow-central/systemd/grow-central-http.socket /etc/systemd/system/grow-central-http.socket
          install -o root -g root -m 0644 /opt/135er-grow-central/systemd/grow-central-http.service /etc/systemd/system/grow-central-http.service

          cat >/usr/local/sbin/grow-central-healthcheck.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail
          if curl --fail --silent --max-time 8 http://127.0.0.1:8080/api/health | jq -e '.ok == true' >/dev/null; then
            exit 0
          fi
          systemctl reset-failed 135er-grow-central.service || true
          systemctl restart 135er-grow-central.service
          sleep 5
          curl --fail --silent --max-time 8 http://127.0.0.1:8080/api/health | jq -e '.ok == true' >/dev/null
          EOF
          chmod 0755 /usr/local/sbin/grow-central-healthcheck.sh

          cat >/etc/systemd/system/grow-central-healthcheck.service <<'EOF'
          [Unit]
          Description=Verify and recover the Grow Central web interface
          After=135er-grow-central.service
          OnFailure=grow-central-support-on-failure@%n.service
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/grow-central-healthcheck.sh
          EOF

          cat >/etc/systemd/system/grow-central-healthcheck.timer <<'EOF'
          [Unit]
          Description=Periodic Grow Central web-interface health check
          [Timer]
          OnBootSec=45s
          OnUnitActiveSec=2min
          Unit=grow-central-healthcheck.service
          [Install]
          WantedBy=timers.target
          EOF

          mkdir -p /etc/ssh/sshd_config.d
          printf 'PasswordAuthentication yes\nPermitRootLogin no\n' >/etc/ssh/sshd_config.d/99-grow-central-test.conf

          cat >/usr/local/sbin/grow-central-headless-firstboot.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail
          usermod --shell /bin/bash GrowCentral
          passwd --unlock GrowCentral || true
          chage --expiredate -1 --inactive -1 GrowCentral
          rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf
          rm -f /etc/systemd/system/serial-getty@ttyAMA0.service.d/autologin.conf
          ssh-keygen -A
          mkdir -p /run/sshd
          /usr/sbin/sshd -t
          touch /var/lib/135er-grow-central/.headless-firstboot-ready
          EOF
          chmod 0755 /usr/local/sbin/grow-central-headless-firstboot.sh

          cat >/usr/local/sbin/grow-central-bluetooth-init.sh <<'EOF'
          #!/bin/bash
          set -u
          command -v rfkill >/dev/null && rfkill unblock bluetooth || true
          systemctl is-active --quiet bluetooth.service || exit 0
          timeout 10 bluetoothctl power on || true
          exit 0
          EOF
          chmod 0755 /usr/local/sbin/grow-central-bluetooth-init.sh

          cat >/etc/systemd/system/grow-central-bluetooth-init.service <<'EOF'
          [Unit]
          Description=Initialize optional Grow Central Bluetooth radio
          After=bluetooth.service
          Wants=bluetooth.service
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/grow-central-bluetooth-init.sh
          [Install]
          WantedBy=multi-user.target
          EOF

          cat >/etc/systemd/system/grow-central-headless-firstboot.service <<'EOF'
          [Unit]
          Description=Prepare Grow Central console and SSH access
          After=local-fs.target bluetooth.service
          Wants=bluetooth.service
          Before=ssh.service getty@tty1.service
          ConditionPathExists=!/var/lib/135er-grow-central/.headless-firstboot-ready
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/grow-central-headless-firstboot.sh
          RemainAfterExit=yes
          [Install]
          WantedBy=multi-user.target
          EOF

          cat >/usr/local/sbin/grow-central-firstboot-firewall.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail
          MARKER=/var/lib/135er-grow-central/.firewall-initialized
          [ -e "$MARKER" ] && exit 0
          ufw --force reset
          ufw default deny incoming
          ufw default allow outgoing
          ufw allow 22/tcp
          ufw allow 80/tcp
          ufw allow 8080/tcp
          ufw allow 5353/udp
          WLAN="$(cat /var/lib/135er-grow-central/hardware-wlan-interface 2>/dev/null || true)"
          if [ -z "$WLAN" ]; then
            WLAN="$(nmcli -t -e yes -f DEVICE,TYPE device status 2>/dev/null | awk -F: '$2 == "wifi" {print $1; exit}')"
          fi
          if [ -n "$WLAN" ]; then
            ufw allow in on "$WLAN" to any port 67 proto udp
            ufw allow in on "$WLAN" to any port 53 proto udp
            ufw allow in on "$WLAN" to any port 53 proto tcp
          fi
          ufw --force enable
          install -o growcentral -g growcentral -m 0640 /dev/null "$MARKER"
          EOF
          chmod 0755 /usr/local/sbin/grow-central-firstboot-firewall.sh

          cat >/etc/systemd/system/grow-central-firstboot-firewall.service <<'EOF'
          [Unit]
          Description=135er-Grow Central first-boot firewall initialization
          After=local-fs.target
          Before=135er-grow-central.service
          ConditionPathExists=!/var/lib/135er-grow-central/.firewall-initialized
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/grow-central-firstboot-firewall.sh
          RemainAfterExit=yes
          [Install]
          WantedBy=multi-user.target
          EOF

          install -o root -g root -m 0755 /opt/135er-grow-central/image-builder/firstboot/setup-ap.sh /usr/local/sbin/grow-central-setup-ap.sh
          install -o root -g root -m 0755 /opt/135er-grow-central/image-builder/firstboot/apply_setup.py /usr/local/sbin/grow-central-apply-setup.py
          install -o root -g root -m 0755 /opt/135er-grow-central/image-builder/firstboot-debug.sh /usr/local/sbin/grow-central-support-bundle

          cat >/etc/systemd/system/grow-central-setup-ap.service <<'EOF'
          [Unit]
          Description=Prepare the first-boot access point
          After=NetworkManager.service grow-central-firstboot-firewall.service
          Wants=NetworkManager.service
          ConditionPathExists=!/var/lib/135er-grow-central/.provisioned
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/grow-central-setup-ap.sh
          RemainAfterExit=yes
          [Install]
          WantedBy=multi-user.target
          EOF

          cat >/etc/systemd/system/grow-central-apply-setup.path <<'EOF'
          [Unit]
          Description=Watch for submitted Grow Central first-boot configuration
          [Path]
          PathExists=/var/lib/135er-grow-central/setup-pending.json
          Unit=grow-central-apply-setup.service
          [Install]
          WantedBy=multi-user.target
          EOF

          cat >/etc/systemd/system/grow-central-apply-setup.service <<'EOF'
          [Unit]
          Description=Validate and apply Grow Central first-boot configuration
          After=NetworkManager.service
          OnFailure=grow-central-support-on-failure@%n.service
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/grow-central-apply-setup.py
          EOF

          cat >/etc/systemd/system/grow-central-firstboot-debug.service <<'EOF'
          [Unit]
          Description=Record the complete 135er-Grow Central first-boot transition
          Wants=NetworkManager.service avahi-daemon.service 135er-grow-central.service
          After=NetworkManager.service
          ConditionPathExists=!/var/lib/135er-grow-central/.firstboot-debug-complete
          [Service]
          Type=simple
          ExecStart=/usr/local/sbin/grow-central-support-bundle --boot-watch
          Environment=GC_DEBUG_WATCH_SECONDS=3600
          TimeoutStopSec=30
          KillMode=control-group
          Nice=10
          IOSchedulingClass=best-effort
          IOSchedulingPriority=7
          [Install]
          WantedBy=multi-user.target
          EOF

          cat >/etc/systemd/system/grow-central-support-bundle.path <<'EOF'
          [Unit]
          Description=Watch for Grow Central support-bundle requests
          [Path]
          PathChanged=/var/lib/135er-grow-central/support-bundle-request
          Unit=grow-central-support-bundle.service
          [Install]
          WantedBy=multi-user.target
          EOF

          cat >/etc/systemd/system/grow-central-support-bundle.service <<'EOF'
          [Unit]
          Description=Create a redacted Grow Central support bundle
          After=local-fs.target
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/grow-central-support-bundle --snapshot
          ExecStartPost=/usr/bin/rm -f /var/lib/135er-grow-central/support-bundle-request
          TimeoutStartSec=300
          Nice=10
          EOF

          cat >/etc/systemd/system/grow-central-support-on-failure@.service <<'EOF'
          [Unit]
          Description=Queue Grow Central support bundle after %i failure
          [Service]
          Type=oneshot
          ExecStart=/usr/bin/touch /var/lib/135er-grow-central/support-bundle-request
          EOF

          THEME=/usr/share/plymouth/themes/135er-grow-central
          mkdir -p "$THEME" /etc/135er-grow-central
          cp /opt/135er-grow-central/image-builder/brand/boot-splash-v0.9.png "$THEME/logo.png"
          cp /opt/135er-grow-central/image-builder/brand/console-banner.txt /etc/135er-grow-central/banner.txt
          cat >"$THEME/135er-grow-central.plymouth" <<'EOF'
          [Plymouth Theme]
          Name=135er-Grow Central
          Description=135er-Grow Central boot console with status and logo
          ModuleName=script
          [script]
          ImageDir=/usr/share/plymouth/themes/135er-grow-central
          ScriptFile=/usr/share/plymouth/themes/135er-grow-central/135er-grow-central.script
          EOF
          cat >"$THEME/135er-grow-central.script" <<'EOF'
          Window.SetBackgroundTopColor(0.01, 0.025, 0.03);
          Window.SetBackgroundBottomColor(0.005, 0.012, 0.015);
          logo = Image("logo.png");
          logo_width = Window.GetWidth() * 0.34;
          scaled = logo.Scale(logo_width, logo_width * 0.5628);
          sprite = Sprite(scaled);
          sprite.SetX(Window.GetWidth() - scaled.GetWidth() - 24);
          sprite.SetY(18);
          status_sprite = Sprite();
          fun show_status(text) {
            status_image = Image.Text(text, 0.65, 0.78, 0.80);
            status_sprite.SetImage(status_image);
            status_sprite.SetX(32);
            status_sprite.SetY(Window.GetHeight() - status_image.GetHeight() - 30);
          }
          Plymouth.SetUpdateStatusFunction(show_status);
          Plymouth.SetMessageFunction(show_status);
          EOF
          plymouth-set-default-theme 135er-grow-central || true

          update-initramfs -u || true
          if [ -f /boot/firmware/cmdline.txt ] && ! grep -qw splash /boot/firmware/cmdline.txt; then
            sed -i '1 s/$/ quiet splash plymouth.ignore-serial-consoles/' /boot/firmware/cmdline.txt
          fi

          cat >/etc/profile.d/135er-grow-central-banner.sh <<'EOF'
          case "$-" in
            *i*) [ -r /etc/135er-grow-central/banner.txt ] && cat /etc/135er-grow-central/banner.txt ;;
          esac
          EOF
          chmod 0644 /etc/profile.d/135er-grow-central-banner.sh /etc/135er-grow-central/banner.txt

          systemctl enable NetworkManager.service avahi-daemon.service grow-central-headless-firstboot.service grow-central-bluetooth-init.service ssh bluetooth grow-central-firstboot-firewall.service grow-central-setup-ap.service grow-central-apply-setup.path grow-central-firstboot-debug.service grow-central-support-bundle.path 135er-grow-central.service grow-central-http.socket grow-central-healthcheck.timer
          systemctl enable unattended-upgrades.service || true

          id GrowCentral
          test "$(getent passwd 1000 | cut -d: -f1)" = GrowCentral
          test "$(getent passwd GrowCentral | cut -d: -f7)" = /bin/bash
          test "$(passwd --status GrowCentral | awk '{print $2}')" = P
          test "$(systemctl is-enabled userconfig.service)" = masked
          test "$(systemctl is-enabled grow-central-headless-firstboot.service)" = enabled
          test "$(systemctl is-enabled grow-central-setup-ap.service)" = enabled
          test "$(systemctl is-enabled grow-central-apply-setup.path)" = enabled
          test "$(systemctl is-enabled grow-central-firstboot-debug.service)" = enabled
          test "$(systemctl is-enabled grow-central-support-bundle.path)" = enabled
          test "$(systemctl is-enabled ssh.service)" = enabled
          test "$(systemctl is-enabled avahi-daemon.service)" = enabled
          mkdir -p /run/sshd
          ssh-keygen -A
          /usr/sbin/sshd -t
          rm -f /etc/ssh/ssh_host_*
          test "$(systemctl is-enabled 135er-grow-central.service)" = enabled
          test "$(systemctl is-enabled grow-central-http.socket)" = enabled
          grep -q '^ExecStart=.*/uvicorn app.entrypoint:app ' /etc/systemd/system/135er-grow-central.service
          grep -q '^ListenStream=80$' /etc/systemd/system/grow-central-http.socket
          grep -q '^ExecStart=/usr/lib/systemd/systemd-socket-proxyd 127.0.0.1:8080$' /etc/systemd/system/grow-central-http.service
          grep -q '^SupplementaryGroups=systemd-journal video netdev$' /etc/systemd/system/135er-grow-central.service
          test "$(systemctl is-enabled grow-central-healthcheck.timer)" = enabled
          /bin/bash -n /usr/local/sbin/grow-central-healthcheck.sh
          systemd-analyze verify /etc/systemd/system/135er-grow-central.service /etc/systemd/system/grow-central-http.socket /etc/systemd/system/grow-central-http.service /etc/systemd/system/grow-central-healthcheck.service /etc/systemd/system/grow-central-healthcheck.timer /etc/systemd/system/grow-central-setup-ap.service /etc/systemd/system/grow-central-apply-setup.path /etc/systemd/system/grow-central-apply-setup.service /etc/systemd/system/grow-central-firstboot-debug.service /etc/systemd/system/grow-central-support-bundle.path /etc/systemd/system/grow-central-support-bundle.service /etc/systemd/system/grow-central-support-on-failure@.service
          grep -q 'ufw allow 80/tcp' /usr/local/sbin/grow-central-firstboot-firewall.sh
          grep -q 'port 67 proto udp' /usr/local/sbin/grow-central-firstboot-firewall.sh
          /bin/bash -n /usr/local/sbin/grow-central-bluetooth-init.sh
          /usr/bin/python3 -m py_compile /usr/local/sbin/grow-central-apply-setup.py
          /bin/bash -n /usr/local/sbin/grow-central-setup-ap.sh
          /bin/bash -n /usr/local/sbin/grow-central-support-bundle
          grep -q '^Storage=persistent$' /etc/systemd/journald.conf.d/20-grow-central-persistent.conf
          command -v last
          command -v avahi-resolve-host-name
          test -z "$(find /etc/netplan /usr/lib/netplan -type f -name '*.yaml' ! -perm 0600 -print -quit 2>/dev/null)"
          id -nG GrowCentral | grep -qw growcentral
          for group in bluetooth video netdev; do id -nG growcentral | grep -qw "$group"; done
          test "$(stat -c '%U:%G:%a' /opt/135er-grow-central/.env)" = root:growcentral:640
          test "$(stat -c '%U:%G:%a' /var/lib/135er-grow-central)" = growcentral:growcentral:750
          test "$(stat -c '%U:%G:%a' /var/lib/135er-grow-central/support)" = root:growcentral:750
          test "$(stat -c '%U:%G:%a' /etc/polkit-1/rules.d/60-grow-central-network.rules)" = root:root:644
          runuser -u growcentral -- test -r /opt/135er-grow-central/.env
          if runuser -u growcentral -- test -w /opt/135er-grow-central/.env; then exit 1; fi
          runuser -u growcentral -- test -w /opt/135er-grow-central/data
          runuser -u growcentral -- test -w /var/lib/135er-grow-central
          if runuser -u growcentral -- test -w /opt/135er-grow-central/app/main.py; then exit 1; fi
          grep -Eq '^[0-9]+$' /opt/135er-grow-central/BUILD
          grep -q '^GC_GUI_USERNAME=GrowCentral$' /opt/135er-grow-central/.env
          grep -q '^GC_GUI_PASSWORD_HASH=pbkdf2_sha256\$' /opt/135er-grow-central/.env
          command -v ffmpeg
          command -v v4l2-ctl
          grep -qx 'LANG=de_DE.UTF-8' /etc/default/locale
          grep -qx 'Europe/Berlin' /etc/timezone
          grep -qx 'XKBLAYOUT="de"' /etc/default/keyboard
          grep -qx 'XKBVARIANT="nodeadkeys"' /etc/default/keyboard

          runuser -u growcentral -- /opt/135er-grow-central/.venv/bin/uvicorn app.entrypoint:app --app-dir /opt/135er-grow-central --host 127.0.0.1 --port 8080 >/tmp/grow-central-image-smoke.log 2>&1 &
          SMOKE_PID=$!
          SMOKE_OK=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8080/api/health | jq -e '.ok == true and .version == "0.7.5"' >/dev/null; then
              SMOKE_OK=1
              break
            fi
            sleep 1
          done
          kill "$SMOKE_PID" || true
          wait "$SMOKE_PID" || true
          if [ "$SMOKE_OK" -ne 1 ]; then
            cat /tmp/grow-central-image-smoke.log
            exit 1
          fi

          cat >/etc/motd <<'EOF'
          135er-Grow Central - Raspberry Pi 3B TEST IMAGE alpha-0.7.5
          Hostname: 135er-grow-central
          First boot AP: 135er-GrowCentral-Setup-XXXX
          Setup AP key: grow-central-test
          First GUI: http://10.42.0.1/
          Initial GUI login: GrowCentral / grow-central-test
          Setup: Haupt-GUI > System (new system password, LAN/WLAN, GUI credentials)
          Permanent URL: http://135er-Grow-Central.local/
          Compatibility URL: http://135er-Grow-Central.local:8080/
          Support file: /var/lib/135er-grow-central/support/Grow-Central-Support-latest.tar.gz
          Camera: Logitech C920 / UVC test panel in GUI
          Temporary API token for test clients: test
          DF100M BLE writes and remote cloud commands are disabled by default.
          EOF
          truncate -s 0 /etc/machine-id
          rm -f /var/lib/dbus/machine-id
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          CHROOT

          sync
          cleanup
          trap - EXIT

      - name: Boot and reboot the completed image userspace
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=/mnt/grow-central-boot-smoke
          MACHINE=grow-central-image-smoke
          cp --reflink=auto --sparse=always work.img boot-smoke.img
          LOOP=$(sudo losetup --find --show --partscan boot-smoke.img)
          sudo mkdir -p "$ROOT"
          sudo mount "${LOOP}p2" "$ROOT"
          cleanup_boot() {
            set +e
            sudo machinectl poweroff "$MACHINE" 2>/dev/null
            sleep 2
            sudo umount "$ROOT" 2>/dev/null
            sudo losetup -d "$LOOP" 2>/dev/null
            rm -f boot-smoke.img
          }
          trap cleanup_boot EXIT

          check_boot() {
            local phase="$1"
            sudo systemd-nspawn --quiet --boot --register=yes --machine="$MACHINE" --directory="$ROOT" --private-network &
            local nspawn_pid=$!
            local ready=0
            for attempt in $(seq 1 90); do
              if sudo systemd-run --quiet --wait --pipe --machine="$MACHINE" /bin/bash -c \
                "/usr/bin/curl --fail --silent --max-time 3 http://127.0.0.1:8080/api/health | /usr/bin/jq -e '.ok == true and .version == \"0.7.5\"' >/dev/null && /usr/bin/curl --fail --silent --max-time 3 http://127.0.0.1/api/health | /usr/bin/jq -e '.ok == true and .version == \"0.7.5\"' >/dev/null" >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              sudo systemd-run --quiet --wait --pipe --machine="$MACHINE" /usr/bin/systemctl status 135er-grow-central.service --no-pager -l || true
              sudo systemd-run --quiet --wait --pipe --machine="$MACHINE" /usr/bin/journalctl -u 135er-grow-central.service -b --no-pager -n 200 || true
              echo "Image ${phase} boot did not expose healthy application and simple-login endpoints on ports 8080 and 80" >&2
              exit 1
            fi
            sudo systemd-run --quiet --wait --pipe --machine="$MACHINE" /usr/bin/systemctl is-active 135er-grow-central.service
            sudo systemd-run --quiet --wait --pipe --machine="$MACHINE" /usr/bin/systemctl is-active grow-central-http.socket
            sudo machinectl poweroff "$MACHINE"
            wait "$nspawn_pid" || true
          }

          sudo rm -f "$ROOT/var/lib/135er-grow-central/.provisioned"
          check_boot pre-setup
          SERVICE_UID=$(sudo chroot "$ROOT" id -u growcentral)
          SERVICE_GID=$(sudo chroot "$ROOT" id -g growcentral)
          sudo install -o "$SERVICE_UID" -g "$SERVICE_GID" -m 0640 /dev/null "$ROOT/var/lib/135er-grow-central/.provisioned"
          check_boot post-setup
          cleanup_boot
          trap - EXIT

      - name: Verify published image is still pristine
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=/mnt/grow-central-pristine-check
          LOOP=$(sudo losetup --find --show --partscan work.img)
          sudo mkdir -p "$ROOT"
          sudo mount -o ro "${LOOP}p2" "$ROOT"
          cleanup_pristine() {
            set +e
            sudo umount "$ROOT" 2>/dev/null
            sudo losetup -d "$LOOP" 2>/dev/null
          }
          trap cleanup_pristine EXIT
          test ! -e "$ROOT/var/lib/135er-grow-central/.provisioned"
          test ! -e "$ROOT/var/lib/135er-grow-central/.firewall-initialized"
          test ! -e "$ROOT/var/lib/135er-grow-central/.headless-firstboot-ready"
          test ! -s "$ROOT/etc/machine-id"
          test -z "$(sudo find "$ROOT/etc/ssh" -maxdepth 1 -type f -name 'ssh_host_*' -print -quit)"
          cleanup_pristine
          trap - EXIT

      - name: Compress and checksum image
        run: |
          VERSIONED_NAME="${IMAGE_NAME}_alpha-0.7.5-build-${GITHUB_RUN_NUMBER}"
          mv work.img "${VERSIONED_NAME}.img"
          xz -T0 -6 -f "${VERSIONED_NAME}.img"
          sha256sum "${VERSIONED_NAME}.img.xz" > "${VERSIONED_NAME}.img.xz.sha256"
          cat > "${VERSIONED_NAME}-CREDENTIALS.txt" <<'EOF'
          Hostname: 135er-grow-central
          First boot AP: 135er-GrowCentral-Setup-XXXX
          Setup AP key: grow-central-test
          First GUI: http://10.42.0.1/
          Initial GUI login: GrowCentral / grow-central-test
          Setup location: authenticated main GUI > System
          Required: change system and GUI passwords during first boot
          Network: LAN is detected; during the Pi 3B setup AP enter the home SSID manually if scanning is unavailable
          FRITZ!: optional dedicated GrowCentral FRITZ!Box user for Smart Home import
          Tapo: optional TP-Link account for encrypted local authentication and automatic LAN import
          Permanent URL: http://135er-Grow-Central.local/
          Compatibility URL: http://135er-Grow-Central.local:8080/
          Support bundle: GUI > System or /var/lib/135er-grow-central/support/Grow-Central-Support-latest.tar.gz
          Camera panel: Logitech C920 / compatible UVC cameras
          Temporary API token for test clients: test
          BLE device writes: disabled
          Remote cloud commands: disabled
          EOF

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 135er-Grow-Central-RPi3Plus-Universal-Image
          path: |
            135er_Grow_Central_RPi3Plus_Universal_alpha-0.7.5-build-*.img.xz
            135er_Grow_Central_RPi3Plus_Universal_alpha-0.7.5-build-*.img.xz.sha256
            135er_Grow_Central_RPi3Plus_Universal_alpha-0.7.5-build-*-CREDENTIALS.txt
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pi-universal-alpha-0.7.5-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" 135er_Grow_Central_RPi3Plus_Universal_alpha-0.7.5-build-${GITHUB_RUN_NUMBER}.img.xz 135er_Grow_Central_RPi3Plus_Universal_alpha-0.7.5-build-${GITHUB_RUN_NUMBER}.img.xz.sha256 135er_Grow_Central_RPi3Plus_Universal_alpha-0.7.5-build-${GITHUB_RUN_NUMBER}-CREDENTIALS.txt --title "135er-Grow Central Raspberry Pi 3+ Universal Image alpha-0.7.5 build ${GITHUB_RUN_NUMBER}" --notes "Universal Raspberry Pi OS Lite 64-bit image for Raspberry Pi 3B/3B+, 4B/400, 5 and compatible Compute Modules. Hardware and NetworkManager interface names are detected at runtime; Pi 3B keeps the confirmed conservative 2.4 GHz setup-AP behavior." --prerelease
