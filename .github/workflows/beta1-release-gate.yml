name: Beta 1.0 Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.0.0-beta.*'
      - '1.0.0-beta.*'

permissions:
  contents: read

jobs:
  beta1-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate beta acceptance evidence, fail closed
        run: python scripts/check_beta1_release.py
      - name: Verify source compiles
        run: python -m compileall -q scripts/check_beta1_release.py
