name: Build QEMU ARM64 Windows Test Image

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/build-qemu-arm64-image.yml'
      - 'image-builder/qemu/**'
      - 'app/**'
      - 'shared/**'
      - 'web/**'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: qemu-arm64-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_URL: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-arm64.qcow2
      BASE_SHA512: fa3c6a469deb88835871c04fa4ac5865de7947806c09bb49045f4427ddf8e7a8763ba018526f380958784f6bcdc2786cc55fe58775fe1b066f8ae7f3d9f9de6f
      IMAGE_NAME: 135er_Grow_Central_QEMU_ARM64

    steps:
      - name: Checkout 135er-Grow Central
        uses: actions/checkout@v5

      - name: Install ARM64 image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-utils qemu-user-static binfmt-support cloud-guest-utils e2fsprogs rsync zip curl

      - name: Download and verify Debian ARM64
        run: |
          curl -L --fail --retry 5 --retry-delay 3 -o "${IMAGE_NAME}.qcow2" "$BASE_URL"
          echo "$BASE_SHA512  ${IMAGE_NAME}.qcow2" | sha512sum -c -
          qemu-img resize "${IMAGE_NAME}.qcow2" +2G

      - name: Install Grow Central into QEMU image
        shell: bash
        run: |
          set -euxo pipefail
          IMAGE="${IMAGE_NAME}.qcow2"
          ROOT=/mnt/grow-central-qemu
          sudo modprobe nbd max_part=16
          sudo qemu-nbd --connect=/dev/nbd0 "$IMAGE"
          cleanup() {
            set +e
            sudo umount "$ROOT/dev/pts" 2>/dev/null
            sudo umount "$ROOT/dev" 2>/dev/null
            sudo umount "$ROOT/proc" 2>/dev/null
            sudo umount "$ROOT/sys" 2>/dev/null
            sudo umount "$ROOT" 2>/dev/null
            sudo qemu-nbd --disconnect /dev/nbd0 2>/dev/null
          }
          trap cleanup EXIT
          sudo partprobe /dev/nbd0
          sudo growpart /dev/nbd0 1
          sudo e2fsck -fy /dev/nbd0p1
          sudo resize2fs /dev/nbd0p1
          sudo mkdir -p "$ROOT"
          sudo mount /dev/nbd0p1 "$ROOT"

          sudo mkdir -p "$ROOT/opt/135er-grow-central"
          sudo rsync -a --delete \
            --exclude='.git' --exclude='.github' \
            --exclude='*.img' --exclude='*.img.xz' --exclude='*.qcow2' --exclude='*.zip' \
            ./ "$ROOT/opt/135er-grow-central/"
          sudo cp /usr/bin/qemu-aarch64-static "$ROOT/usr/bin/"
          sudo mount --bind /dev "$ROOT/dev"
          sudo mount --bind /dev/pts "$ROOT/dev/pts"
          sudo mount -t proc proc "$ROOT/proc"
          sudo mount -t sysfs sys "$ROOT/sys"
          sudo cp --remove-destination /etc/resolv.conf "$ROOT/etc/resolv.conf"

          sudo chroot "$ROOT" /bin/bash -eux <<'CHROOT'
          export DEBIAN_FRONTEND=noninteractive
          echo 'grow-central-qemu' >/etc/hostname
          sed -i 's/^127\.0\.1\.1.*/127.0.1.1\tgrow-central-qemu/' /etc/hosts || true
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates python3 python3-pip python3-venv openssh-server sudo curl systemd-resolved e2fsprogs

          if ! id test >/dev/null 2>&1; then useradd -m -s /bin/bash test; fi
          echo 'test:test' | chpasswd
          usermod -aG sudo test
          echo 'test ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/010-grow-central-test
          chmod 0440 /etc/sudoers.d/010-grow-central-test

          if ! id growcentral >/dev/null 2>&1; then useradd --system --home /var/lib/135er-grow-central --create-home --shell /usr/sbin/nologin growcentral; fi
          install -d -o growcentral -g growcentral -m 0750 /var/lib/135er-grow-central
          cd /opt/135er-grow-central
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip wheel
          .venv/bin/pip install -r requirements.txt
          cat >.env <<'EOF'
          DF100M_ALLOW_WRITES=false
          GC_TEST_USERNAME=test
          GC_TEST_PASSWORD=test
          GC_API_TOKEN=test
          GC_CLOUD_TOKEN=test
          GC_REMOTE_COMMANDS=false
          GC_CLOUD_ENABLED=false
          EOF
          chown -R root:growcentral /opt/135er-grow-central
          chmod -R g+rX /opt/135er-grow-central
          chmod 0640 /opt/135er-grow-central/.env
          mkdir -p /opt/135er-grow-central/data
          chown growcentral:growcentral /opt/135er-grow-central/data

          cat >/etc/systemd/system/135er-grow-central.service <<'EOF'
          [Unit]
          Description=135er-Grow Central QEMU ARM64
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=simple
          User=growcentral
          Group=growcentral
          WorkingDirectory=/opt/135er-grow-central
          EnvironmentFile=/opt/135er-grow-central/.env
          ExecStart=/opt/135er-grow-central/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8080
          Restart=always
          RestartSec=3
          NoNewPrivileges=true
          PrivateTmp=true
          [Install]
          WantedBy=multi-user.target
          EOF

          mkdir -p /etc/systemd/network /etc/ssh/sshd_config.d
          cat >/etc/systemd/network/20-qemu.network <<'EOF'
          [Match]
          Name=en* eth*
          [Network]
          DHCP=yes
          EOF
          printf 'PasswordAuthentication yes\nPermitRootLogin no\n' >/etc/ssh/sshd_config.d/99-grow-central-test.conf
          sed -i '\|[[:space:]]/boot/efi[[:space:]]| s|^|# QEMU direct kernel: |' /etc/fstab
          touch /etc/cloud/cloud-init.disabled
          systemctl enable systemd-networkd systemd-resolved ssh 135er-grow-central.service
          systemctl set-default multi-user.target
          truncate -s 0 /etc/machine-id
          rm -f /var/lib/dbus/machine-id /etc/ssh/ssh_host_*
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          CHROOT

          sudo rm -f "$ROOT/usr/bin/qemu-aarch64-static"
          sudo cp -L "$(find "$ROOT/boot" -maxdepth 1 -name 'vmlinuz-*' | sort | tail -n 1)" ./vmlinuz-qemu-arm64
          sudo cp -L "$(find "$ROOT/boot" -maxdepth 1 -name 'initrd.img-*' | sort | tail -n 1)" ./initrd-qemu-arm64.img
          sudo chown "$USER:$USER" vmlinuz-qemu-arm64 initrd-qemu-arm64.img
          sync
          cleanup
          trap - EXIT
          qemu-img check "$IMAGE"

      - name: Boot and verify QEMU image
        shell: bash
        run: |
          set -euxo pipefail
          qemu-img create -f qcow2 -F qcow2 -b "$(pwd)/${IMAGE_NAME}.qcow2" qemu-smoke-overlay.qcow2
          qemu-system-aarch64 \
            -M virt -accel tcg,thread=multi -cpu max -smp 4 -m 2048 \
            -nographic -no-reboot \
            -kernel vmlinuz-qemu-arm64 -initrd initrd-qemu-arm64.img \
            -append 'root=/dev/vda1 rw rootwait console=ttyAMA0,115200 fsck.repair=yes net.ifnames=0' \
            -drive file=qemu-smoke-overlay.qcow2,format=qcow2,if=none,id=system \
            -device virtio-blk-pci,drive=system \
            -netdev user,id=network,hostfwd=tcp::18080-:8080,hostfwd=tcp::12222-:22 \
            -device virtio-net-pci,netdev=network \
            -device virtio-rng-pci >qemu-boot.log 2>&1 &
          QEMU_PID=$!
          trap 'kill "$QEMU_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://127.0.0.1:18080/api/health >qemu-health.json; then
              cat qemu-health.json
              grep -q '"ok"' qemu-health.json
              exit 0
            fi
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              cat qemu-boot.log
              exit 1
            fi
            sleep 2
          done
          cat qemu-boot.log
          echo 'QEMU did not expose the Grow Central health endpoint within six minutes.' >&2
          exit 1

      - name: Build Windows download package
        run: |
          mkdir package
          cp "${IMAGE_NAME}.qcow2" vmlinuz-qemu-arm64 initrd-qemu-arm64.img package/
          cp image-builder/qemu/start-qemu-arm64-windows.ps1 package/
          cp image-builder/qemu/start-qemu-arm64-windows.cmd package/
          cp image-builder/qemu/README-QEMU-ARM64-DE.txt package/
          (cd package && zip -6 "../${IMAGE_NAME}-Windows.zip" *)
          sha256sum "${IMAGE_NAME}-Windows.zip" >"${IMAGE_NAME}-Windows.zip.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: 135er-Grow-Central-QEMU-ARM64-Windows
          path: |
            135er_Grow_Central_QEMU_ARM64-Windows.zip
            135er_Grow_Central_QEMU_ARM64-Windows.zip.sha256
            qemu-health.json
          compression-level: 0
          retention-days: 14

      - name: Publish QEMU prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="qemu-arm64-v0.1-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "${IMAGE_NAME}-Windows.zip" \
            "${IMAGE_NAME}-Windows.zip.sha256" \
            --title '135er-Grow Central QEMU ARM64 Windows Image' \
            --notes 'Debian 13 ARM64 image for QEMU on Windows. Automatically booted and verified through /api/health before publication. Web UI: http://localhost:8080. SSH: localhost:2222, test / test. Bluetooth, GPIO and DF100M radio access require physical hardware.' \
            --prerelease
