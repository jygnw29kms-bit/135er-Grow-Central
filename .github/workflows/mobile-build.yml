name: Build Grow Central native fallback clients

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grow-central-native-fallback-${{ github.ref }}
  cancel-in-progress: true

# Grow Central is PWA-first. This workflow exists only for explicit fallback/testing
# when a required platform capability cannot be delivered safely through the PWA.
# Native clients must never become a second source of business logic.

jobs:
  android:
    name: Android fallback test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android
      - name: Sync Android project
        working-directory: mobile
        run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - name: Stage Android package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/dist/GrowCentral-Android-fallback-debug.apk
          sha256sum mobile/dist/GrowCentral-Android-fallback-debug.apk > mobile/dist/GrowCentral-Android-fallback-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: GrowCentral-Android-Fallback
          path: |
            mobile/dist/GrowCentral-Android-fallback-debug.apk
            mobile/dist/GrowCentral-Android-fallback-debug.apk.sha256
          if-no-files-found: error

  ios:
    name: iOS fallback sideload IPA
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Generate iOS project
        working-directory: mobile
        run: npx cap add ios
      - name: Sync iOS project
        working-directory: mobile
        run: npx cap sync ios
      - name: Prepare iOS local-network metadata
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          PLIST="ios/App/App/Info.plist"
          test -f "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Grow Central" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Grow Central'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Grow Central verbindet sich mit deiner lokalen Grow-Central-Instanz.'" "$PLIST"
      - name: Build unsigned fallback app
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          if [ -d ios/App/App.xcworkspace ]; then
            PROJECT=(-workspace ios/App/App.xcworkspace)
          else
            PROJECT=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild "${PROJECT[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          APP_PATH="$(find build/Build/Products -maxdepth 2 -type d -name 'App.app' | head -n 1)"
          test -n "$APP_PATH"
          rm -rf Payload dist
          mkdir -p Payload dist
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload dist/GrowCentral-iOS-fallback-unsigned.ipa
          shasum -a 256 dist/GrowCentral-iOS-fallback-unsigned.ipa > dist/GrowCentral-iOS-fallback-unsigned.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: GrowCentral-iOS-Fallback
          path: |
            mobile/dist/GrowCentral-iOS-fallback-unsigned.ipa
            mobile/dist/GrowCentral-iOS-fallback-unsigned.ipa.sha256
          if-no-files-found: error
