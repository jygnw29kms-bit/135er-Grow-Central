name: Build 135er-Grow Central Mobile v0.1

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

concurrency:
  group: grow-central-mobile-v0.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android
      - name: Sync Android project
        working-directory: mobile
        run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: GrowCentral-Mobile-v0.1-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Generate iOS project
        working-directory: mobile
        run: npx cap add ios
      - name: Sync iOS project
        working-directory: mobile
        run: npx cap sync ios
      - name: Build unsigned device app
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          if [ -d ios/App/App.xcworkspace ]; then
            PROJECT=(-workspace ios/App/App.xcworkspace)
          else
            PROJECT=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild "${PROJECT[@]}" \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          APP_PATH="$(find build/Build/Products -maxdepth 2 -type d -name 'App.app' | head -n 1)"
          test -n "$APP_PATH"
          rm -rf Payload GrowCentral-Mobile-v0.1-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry GrowCentral-Mobile-v0.1-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: GrowCentral-Mobile-v0.1-iOS-unsigned
          path: mobile/GrowCentral-Mobile-v0.1-unsigned.ipa
          if-no-files-found: error
