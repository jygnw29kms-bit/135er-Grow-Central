name: Build 135er-Grow Central Nexus Mobile

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

concurrency:
  group: grow-central-nexus-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Nexus test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android
      - name: Sync Android project
        working-directory: mobile
        run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - name: Stage Android package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/dist/135er-GrowCentral-Nexus-Android-debug.apk
          sha256sum mobile/dist/135er-GrowCentral-Nexus-Android-debug.apk > mobile/dist/135er-GrowCentral-Nexus-Android-debug.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: GrowCentral-Nexus-Android-APK
          path: |
            mobile/dist/135er-GrowCentral-Nexus-Android-debug.apk
            mobile/dist/135er-GrowCentral-Nexus-Android-debug.apk.sha256
          if-no-files-found: error

  ios:
    name: iOS Nexus sideload IPA
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Generate iOS project
        working-directory: mobile
        run: npx cap add ios
      - name: Sync iOS project
        working-directory: mobile
        run: npx cap sync ios
      - name: Prepare iOS local-network metadata
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          PLIST="ios/App/App/Info.plist"
          test -f "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 135er Grow Central" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string '135er Grow Central'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string '135er Grow Central verbindet sich mit deinem Raspberry Pi und anderen ausdrücklich eingerichteten Grow-Central-Instanzen im lokalen Netzwerk.'" "$PLIST"
      - name: Build unsigned device app for sideload signing
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          if [ -d ios/App/App.xcworkspace ]; then
            PROJECT=(-workspace ios/App/App.xcworkspace)
          else
            PROJECT=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild "${PROJECT[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          APP_PATH="$(find build/Build/Products -maxdepth 2 -type d -name 'App.app' | head -n 1)"
          test -n "$APP_PATH"
          rm -rf Payload dist
          mkdir -p Payload dist
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload dist/135er-GrowCentral-Nexus-iOS-Sideload-unsigned.ipa
          shasum -a 256 dist/135er-GrowCentral-Nexus-iOS-Sideload-unsigned.ipa > dist/135er-GrowCentral-Nexus-iOS-Sideload-unsigned.ipa.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: GrowCentral-Nexus-iOS-Sideload-IPA
          path: |
            mobile/dist/135er-GrowCentral-Nexus-iOS-Sideload-unsigned.ipa
            mobile/dist/135er-GrowCentral-Nexus-iOS-Sideload-unsigned.ipa.sha256
          if-no-files-found: error
