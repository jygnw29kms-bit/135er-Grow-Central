name: Diagnose ERP staging host

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/diagnose-erp-staging-host.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect staging host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.SFTP_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || secrets.SFTP_PORT }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          : "${SSH_PORT:=22}"
          export SSHPASS="$SSH_PASSWORD"
          install -d -m 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          SCRIPT='
          set +e
          echo "=== OS ==="
          cat /etc/os-release
          echo "=== DOTNET ==="
          command -v dotnet && dotnet --info | head -40 || true
          echo "=== POSTGRES ==="
          command -v psql && psql --version || true
          systemctl is-active postgresql 2>/dev/null || true
          echo "=== DOCKER ==="
          command -v docker && docker --version || true
          echo "=== PORTS ==="
          ss -ltnp | grep -E ":(3080|5080|5090|5432)" || true
          echo "=== DISK ==="
          df -h /
          echo "=== RAM ==="
          free -h
          echo "=== ERP dirs ==="
          ls -ld /opt /opt/workshop* /var/www/vhosts/dezender.de/httpdocs 2>/dev/null || true
          echo "=== ERP compose ps ==="
          cd /opt/workshop-erp-staging 2>/dev/null && docker compose --env-file .env ps -a || true
          echo "=== ERP API logs ==="
          cd /opt/workshop-erp-staging 2>/dev/null && docker compose --env-file .env logs --tail=180 api || true
          echo "=== ERP Postgres logs ==="
          cd /opt/workshop-erp-staging 2>/dev/null && docker compose --env-file .env logs --tail=80 postgres || true
          echo "=== PUBLIC HEALTH ==="
          curl -ksS -o /tmp/pubhealth -w "HTTP=%{http_code} TYPE=%{content_type}\n" https://werkstattplaner.grow-central.de/jl/demo/api/health
          head -c 500 /tmp/pubhealth; echo
          echo "=== PUBLIC LOGIN ==="
          curl -ksS -o /tmp/publogin -w "HTTP=%{http_code} TYPE=%{content_type}\n" -H "Content-Type: application/json" -d '{"username":"demo","password":"WerkstattDemo!2026"}' https://werkstattplaner.grow-central.de/jl/demo/api/auth/login
          python3 - <<'PY'
import json
p='/tmp/publogin'
try:
    d=json.load(open(p))
    print("token_present=", bool(d.get("access_token")), "keys=", sorted(d.keys()))
except Exception as e:
    print(open(p).read()[:500])
PY
          echo "=== PAGE ASSET HEADERS ==="
          curl -ksSI https://werkstattplaner.grow-central.de/jl/demo/ | sed -n '1,25p'
          curl -ksSI https://werkstattplaner.grow-central.de/jl/demo/demo.js?v=erp4-staging | sed -n '1,20p'
          echo "=== custom vhost nginx ==="
          cat /var/www/vhosts/system/werkstattplaner.grow-central.de/conf/vhost_nginx.conf 2>/dev/null || true
          echo "=== generated nginx refs ==="
          grep -Rni "jl/demo/api\|127.0.0.1:5090\|werkstattplaner.grow-central.de" /etc/nginx/plesk.conf.d/vhosts /var/www/vhosts/system/werkstattplaner.grow-central.de/conf 2>/dev/null | head -120 || true
          echo "=== local API ==="
          curl -i -sS http://127.0.0.1:5090/api/health | head -20 || true
          echo "=== public API ==="
          curl -k -i -sS https://werkstattplaner.grow-central.de/jl/demo/api/health | head -30 || true
          '

          B64="$(printf '%s' "$SCRIPT" | base64 -w0)"
          if sshpass -e ssh -p "$SSH_PORT" -o BatchMode=no "$SSH_USERNAME@$SSH_HOST" 'id -u' | grep -qx 0; then
            sshpass -e ssh -p "$SSH_PORT" -o BatchMode=no "$SSH_USERNAME@$SSH_HOST" "echo '$B64' | base64 -d | bash"
          else
            printf '%s\n' "$SSH_PASSWORD" | sshpass -e ssh -p "$SSH_PORT" -o BatchMode=no "$SSH_USERNAME@$SSH_HOST" "sudo -S -p '' bash -c \"echo '$B64' | base64 -d | bash\""
          fi
