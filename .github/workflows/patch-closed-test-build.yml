name: Patch closed-test image builder

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.ci/trigger-image-patch.txt'
      - '.ci/patch_image_builder.py'
      - '.github/workflows/patch-closed-test-build.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master

      - name: Patch image workflow
        run: python3 .ci/patch_image_builder.py

      - name: Commit patch
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/workflows/build-pi3-image.yml
            git commit -m 'test(image): harden closed-test appliance build'
            git push origin master
          else
            echo 'Image workflow already patched.'
          fi

      - name: Start next image build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-pi3-image.yml --ref master
