name: Recover Build 13 release asset

on:
  push:
    paths:
      - ".github/workflows/recover-build13-release.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Download tested Build 13 artifact
        uses: actions/download-artifact@v4
        with:
          name: 135er-Grow-Central-RPi3B-Test-Image
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31582571038

      - name: Verify recovered image
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test -s 135er_Grow_Central_RPi3B_Test_alpha-0.7.4-build-13.img.xz
          test -s 135er_Grow_Central_RPi3B_Test_alpha-0.7.4-build-13.img.xz.sha256
          sha256sum -c 135er_Grow_Central_RPi3B_Test_alpha-0.7.4-build-13.img.xz.sha256

      - name: Upload missing image with retries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE=dist/135er_Grow_Central_RPi3B_Test_alpha-0.7.4-build-13.img.xz
          NAME=${FILE##*/}
          RELEASE_ID=369126196
          curl --fail-with-body --location \
            --retry 8 --retry-delay 15 --retry-all-errors \
            --connect-timeout 30 --max-time 7200 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/octet-stream" \
            --upload-file "${FILE}" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${NAME}"

      - name: Validate and publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_ID=369126196
          EXPECTED=135er_Grow_Central_RPi3B_Test_alpha-0.7.4-build-13.img.xz
          ASSET_SIZE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            --jq ".[] | select(.name == \"${EXPECTED}\") | .size")
          test -n "${ASSET_SIZE}"
          test "${ASSET_SIZE}" -gt 1000000000
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f tag_name=pi3-test-alpha-0.7.4-13 \
            -f target_commitish=master \
            -f name="135er-Grow Central Raspberry Pi 3B Test Image alpha-0.7.4 build 13" \
            -F draft=false \
            -F prerelease=true
