name: Force current GrowCentral image build

# Touch this workflow intentionally to dispatch a fresh candidate image from current master.
on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/force-current-image-build.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional image prerelease to receive test companions
        required: false
        type: string
      source_sha:
        description: Exact source commit for companions
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  dispatch-image-build:
    if: ${{ !inputs.release_tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current universal image workflow on master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-pi3-image.yml --repo "${GITHUB_REPOSITORY}" --ref master
          echo "Image workflow dispatch requested for master ${GITHUB_SHA}"

  package:
    if: ${{ inputs.release_tag != '' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify release source
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^pi-universal-alpha-[0-9.]+-[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$SOURCE_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: python -m platformio run -d firmware/gc-soil-node
      - name: Package Home Assistant and sensor firmware
        run: |
          python scripts/package-sensor-firmware.py
          python scripts/package-image-companions.py test-companions
      - name: Upload companions to image prerelease
        run: gh release upload "$RELEASE_TAG" test-companions/* --repo "$GITHUB_REPOSITORY"
