name: Owner-only Grow Central image policy guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-image-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce operator image distribution only
        run: |
          echo "Public image dispatch, artifact forwarding and release uploads are disabled."
          echo "Use scripts/build-private-pi-image.sh on an owner-controlled builder."
