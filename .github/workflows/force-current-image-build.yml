name: Force current GrowCentral image build

# Touch this workflow intentionally to dispatch a fresh candidate image from current master.
on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/force-current-image-build.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional image prerelease to receive test companions
        required: false
        type: string
      source_sha:
        description: Exact source commit for companions
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  dispatch-image-build:
    if: ${{ !inputs.release_tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current universal image workflow on master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-pi3-image.yml --repo "${GITHUB_REPOSITORY}" --ref master
          echo "Image workflow dispatch requested for master ${GITHUB_SHA}"

  package:
    if: ${{ inputs.release_tag != '' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify release source
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^pi-universal-alpha-[0-9.]+-[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$SOURCE_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: python -m platformio run -d firmware/gc-soil-node
      - name: Package Home Assistant and sensor firmware
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, os, zipfile
          out = Path('test-companions')
          out.mkdir()
          source = Path('integrations/home_assistant/custom_components/grow_central')
          with zipfile.ZipFile(out / 'grow-central-homeassistant-0.1.0.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in sorted(source.rglob('*')):
                  if p.is_file() and p.suffix in {'.py', '.json'}:
                      z.write(p, 'custom_components/grow_central/' + str(p.relative_to(source)))
              z.write('docs/de/HOME_ASSISTANT.md', 'INSTALLATION.md')
              z.write('integrations/home_assistant/examples/homekit.yaml', 'examples/homekit.yaml')
              z.writestr('SOURCE.txt', os.environ['SOURCE_SHA'] + '\n')
          build = Path('firmware/gc-soil-node/.pio/build/seeed_xiao_esp32c3')
          files = {name: build / name for name in ['firmware.bin', 'bootloader.bin', 'partitions.bin']}
          files['boot_app0.bin'] = Path.home() / '.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin'
          with zipfile.ZipFile(out / 'gc-soil-node-0.3.0-test.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              checks = []
              for name, p in files.items():
                  checks.append(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + name)
                  z.write(p, name)
              z.writestr('SHA256SUMS', '\n'.join(checks) + '\n')
              z.writestr('SOURCE.txt', os.environ['SOURCE_SHA'] + '\n')
              z.writestr('README.txt', 'XIAO ESP32-C3 ONLY; not a Raspberry Pi image.\nRecommended: upload the source using PlatformIO.\nOffsets: bootloader 0x0, partitions 0x8000, boot_app0 0xe000, firmware 0x10000.\nPreserve NVS identity/calibration; do not erase flash for an update.\nUSB provisioning and individual MQTT TLS credentials required. BLE provisioning is not implemented.\nReal hardware testing remains pending. See SENSOR_PAIRING.md.\n')
              z.write('docs/de/SENSOR_PAIRING.md', 'SENSOR_PAIRING.md')
          sums = []
          for p in out.glob('*.zip'):
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None
              sums.append(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name)
          (out / 'COMPANIONS.sha256').write_text('\n'.join(sums) + '\n')
          PY
      - name: Upload companions to image prerelease
        run: gh release upload "$RELEASE_TAG" test-companions/* --repo "$GITHUB_REPOSITORY"
